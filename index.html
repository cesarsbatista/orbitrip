@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',Inter,system-ui,sans-serif;background:#f4f7fa;color:#112842}
h1,h2,h3,.brand{font-family:Outfit,'DM Sans',sans-serif}
.sidebar{background:linear-gradient(170deg,#08182e,#12395c 72%,#0b233c);box-shadow:8px 0 30px #0b28410a}
.brand{font-size:25px;letter-spacing:.08em}.brand small{color:#69ded2}
.nav button.active{background:linear-gradient(90deg,#31bfb51e,#4a89ff20);border-left:3px solid #35d0c1}
.main{max-width:1540px}.eyebrow{color:#179b9c}
.btn{background:#153e62}.btn:hover{background:#23648d}
.btn.primary{background:linear-gradient(120deg,#164b76,#0a9eaa);box-shadow:0 7px 24px #1288a12c}
.card{border-color:#e3ebf3;box-shadow:0 12px 32px #12345608}
.card,.item{transition:transform .22s ease,box-shadow .22s ease}
.card:hover{box-shadow:0 17px 42px #12345612}
.trip:hover{transform:translateY(-3px)}
.stat strong{color:#133b5c}.chip.ongoing{background:#dff8f4;color:#0d7f7c}
.orbit-hero{overflow:hidden;position:relative;isolation:isolate;color:white;border-radius:23px;min-height:230px;margin-bottom:22px;padding:34px 38px;background:linear-gradient(92deg,#081c36df,#0e3b5ba0 56%,#08274320),url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1600&auto=format&fit=crop&q=85') center 45%/cover}
.orbit-hero:after{content:'';position:absolute;right:4%;top:-100px;width:380px;height:380px;border:1px solid #ffffff44;border-radius:50%;box-shadow:0 0 0 65px #ffffff0b,0 0 0 130px #ffffff08;z-index:-1;pointer-events:none}
.orbit-hero h1{font-size:clamp(34px,5vw,57px);letter-spacing:-.045em;max-width:660px;line-height:1.04;margin:13px 0}
.orbit-hero p{max-width:520px;color:#e7f4fa;font-size:15px;line-height:1.6}
.orbit-hero .eyebrow{color:#80fff0}.orbit-hero .btn{background:white;color:#144160}
.trip-photo{height:125px;margin:-22px -22px 8px;border-radius:16px 16px 0 0;background:linear-gradient(135deg,#12446890,#35d0c155),url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=700&auto=format&fit=crop&q=80') center/cover}
.trip:nth-child(3n+2) .trip-photo{background-image:linear-gradient(135deg,#12446870,#35d0c133),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700&auto=format&fit=crop&q=80')}
.trip:nth-child(3n) .trip-photo{background-image:linear-gradient(135deg,#12446870,#35d0c133),url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=700&auto=format&fit=crop&q=80')}
.orbit-subhead{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin:0 0 17px}
#orbit-map{height:min(68vh,620px);min-height:360px;z-index:0;border-radius:15px;background:#dbeaf0}
.map-grid{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);gap:16px}
.map-side{max-height:660px;overflow:auto}.map-side .map-entry{width:100%;text-align:left;padding:12px;background:white;border:1px solid #e2ebf1;border-radius:10px;margin:0 0 9px}
.map-side .map-entry:hover{border-color:#21a6ac;background:#f3fbfa}
.map-legend{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.map-legend select{width:auto}
.orbit-marker{background:#0e8498;border:3px solid white;color:white;display:grid;place-items:center;font-weight:800;border-radius:50%;box-shadow:0 3px 11px #103c6070}
.calcgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:19px}.calc-total{background:linear-gradient(145deg,#0d2d4b,#11657d);color:#fff;border-radius:18px;padding:27px}.calc-total strong{font-size:32px;display:block;margin:12px 0}.calc-total .muted{color:#c9e2ef}
.importbox{border:2px dashed #a4c6d7;border-radius:17px;padding:26px;background:#f5fbfc;text-align:center;margin-top:16px}
.previewtable{width:100%;border-collapse:collapse;font-size:12px}.previewtable th,.previewtable td{border-bottom:1px solid #e5edf1;padding:8px;text-align:left;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.previewscroll{overflow:auto;max-height:300px}.footer-note{margin-top:20px;font-size:12px;color:#73899b}
@keyframes orbitRise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
.main>.top,.main>.orbit-hero,.main>.grid,.main>.statgrid,.main>.tabs{animation:orbitRise .35s ease both}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:850px){.map-grid,.calcgrid{grid-template-columns:1fr}.map-side{max-height:240px}.orbit-hero{padding:24px;min-height:230px}}


/* ORBITRIP 3.1 — visual editorial minimalista, mobile-first */
:root{--bg:#F5F7F7;--surface:#FFFFFF;--ink:#152A33;--muted:#6B8087;--line:#E3E9EA;--accent:#087E7B;--accent-pale:#E7F5F1;--category-attraction:#3673C9;--category-stay:#268659;--category-move:#D34B4D;--category-food:#BD8A18;font-family:'DM Sans',Inter,system-ui,sans-serif!important;color:var(--ink);background:var(--bg)}

.main{background:var(--bg)!important;box-shadow:none!important;padding:34px clamp(20px,4vw,55px) 90px;max-width:1510px}

.top{margin-bottom:23px}

a{color:var(--accent)}
.btn{background:#153E47!important;color:white!important;border-radius:12px!important;box-shadow:none!important;letter-spacing:0!important;font:650 12px 'DM Sans',sans-serif!important;padding:10px 15px;transition:transform .18s,background .18s}

:root{--bg:#FAFAFA;--surface:#fff;--ink:#292929;--muted:#858585;--line:#e8e8e8;--accent:#242424;--accent-pale:#f4f4f4;background:#FAFAFA!important;color:#292929!important}body,.main{background:#FAFAFA!important;color:#292929!important}.sidebar{border-color:#ececec!important}.sidebar .brand,.top h1,h1,h2,h3,.stat strong{color:#292929!important}.sidebar .nav button.active{background:#f2f2f2!important;color:#242424!important}.eyebrow,.badge,.muted{color:#858585!important}.btn,.btn.primary{background:#242424!important;color:white!important}.btn:hover{background:#444!important}.btn.ghost{background:#fff!important;color:#303030!important;border-color:#e6e6e6!important}.card,.item{background:#fff!important;border-color:#ebebeb!important;box-shadow:0 3px 18px #00000009!important}.chip,.chip.ongoing,.chip.archived{background:#f3f3f3!important;color:#666!important}input,select,textarea{border-color:#e4e4e4!important;color:#292929!important}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #555!important}.tabs{border-bottom-color:#e8e8e8!important}.tabs button{color:#888!important}.tabs button.active{color:#242424!important;border-bottom-color:#242424!important}.note{background:#f6f6f6!important;color:#666!important;border-left-color:#777!important}.calc-total{background:linear-gradient(130deg,#303030,#505050)!important}.importbox{background:#fbfbfb!important;border-color:#d6d6d6!important}.orbit-bottom button.active{background:#f1f1f1!important;color:#242424!important}.geo-result:hover{background:#f6f6f6!important}.geo-badge{color:#777!important}.geo-results[hidden]{display:none!important}.v32-homebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 22px}.v32-wordmark{font:750 19px Outfit,sans-serif;letter-spacing:-.055em;color:#292929}.v32-plus{display:grid;place-items:center;width:43px;height:43px;background:#292929;color:#fff;border-radius:50%;font-size:24px}.v32-cover{position:relative}.v32-editcover{position:absolute;right:10px;top:10px;border-radius:30px;background:#fffffff0;color:#333;border:1px solid #fff;padding:9px 12px;font:650 11px 'DM Sans',sans-serif;z-index:2}.v32-editcover:hover{background:#fff}.v32-cover-preview{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;background:#eee}.v32-controls{display:grid;gap:8px;margin:13px 0}.v32-controls label{font-size:12px;font-weight:700}.v32-controls input[type=range]{padding:0;accent-color:#333}.v32-cover-note{font-size:12px;color:#777}.v32-info-cover{height:145px;border-radius:13px;background:#eee url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=700&auto=format&fit=crop&q=80') center/cover;margin-bottom:13px}@media(max-width:750px){.orbit-bottom{background:#fffffffa!important;border-color:#eee!important;box-shadow:0 6px 28px #00000015!important}.v32-homebar{margin:3px 0 17px}}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">◎ ORBITRIP<small>PLANEJADOR DE VIAGENS</small></div><nav class="nav"><button data-route="home" class="active">◫ &nbsp; Minhas viagens</button><button data-route="archived">▤ &nbsp; Arquivadas</button><button data-route="data">↥ &nbsp; Dados e backup</button></nav><div class="sidefoot">Planeje cada etapa.<br>Revise seus custos.<br>Guarde suas histórias.<br><br>Versão 1.0 · Dados neste navegador</div></aside><main class="main" id="app"></main></div><nav class="orbit-bottom" aria-label="Navegação principal"><button data-mobile="home"><span class="icon">⌂</span>Início</button><button data-mobile="route"><span class="icon">▤</span>Roteiro</button><button data-mobile="map"><span class="icon">⌾</span>Mapa</button><button data-mobile="budget"><span class="icon">◈</span>Gastos</button><button data-mobile="more"><span class="icon">☷</span>Mais</button></nav><div id="modal-root"></div>
<script>
(()=>{
"use strict";
const CATEGORY_COLORS={"Hospedagem":"#30845c","Deslocamento":"#c64b49","Atração":"#3376bf","Restaurante":"#b58a18","Voo":"#8660a9","Passeio":"#168d90","Compromisso":"#bb6b32","Outro":"#756a61","Transporte":"#c64b49","Ônibus":"#bd574b","Trem":"#96657f"};function categoryColor(c){return CATEGORY_COLORS[c]||"#756a61"}
const KEY="viagens_v1";
const uid=()=>globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2);
const fresh=()=>({version:1,trips:[]});
const parse=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.trips)?d:fresh()}catch{return fresh()}};
let db=parse(),route="home",tripId=null,tab="route",scenarioId=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,c="BRL")=>{try{return new Intl.NumberFormat("pt-BR",{style:"currency",currency:c}).format(Number(n)||0)}catch{return fmt(n,"BRL")}};
const date=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const period=t=>[date(t.start),date(t.end)].join(" — ");
const money=v=>Math.max(0,Number(v)||0);
const sum=arr=>arr.reduce((s,v)=>s+money(v),0);
const trip=()=>db.trips.find(t=>t.id===tripId);
const scenario=t=>t.scenarios.find(s=>s.id===scenarioId)||t.scenarios[0];
const cost=(t,sid,actual=false)=>sum(t.expenses.filter(e=>!e.scenarioId||e.scenarioId===sid).map(e=>actual?e.actual:e.planned));
const totalEvents=t=>t.events.length;
function navigate(r,id){route=r;if(id)tripId=id;tab="route";scenarioId=null;orbitMapDay="";orbitMapCategory="";render()}
function sidebar(){document.querySelectorAll("[data-route]").forEach(b=>b.classList.toggle("active",b.dataset.route===route||(route==="trip"&&b.dataset.route==="home")));document.querySelectorAll("[data-mobile]").forEach(b=>{const v=b.dataset.mobile;b.classList.toggle("active",v==="home"?(route==="home"||route==="archived"||route==="data"):(route==="trip"&&(v===tab||(v==="more"&&!["route","map","budget"].includes(tab)))))})}
const button=(label,action,kind="ghost")=>'<button class="btn '+kind+' small" data-action="'+action+'">'+label+'</button>';
function render(){sidebar();const a=document.getElementById("app");if(route==="home"||route==="archived")a.innerHTML=home(route==="archived");else if(route==="trip")a.innerHTML=detail();else a.innerHTML=dataPage();if(route==="trip"&&tab==="map")setTimeout(initializeMap,50);if(route==="trip"&&tab==="calculator")setTimeout(calculateLive,0)}
function home(archived){const items=db.trips.filter(t=>!!t.archived===archived).sort((a,b)=>(a.start||"").localeCompare(b.start||""));return '<div class="v32-homebar"><b class="v32-wordmark">ORBITRIP<span style="color:#999">.</span></b><div class="row">'+(archived?button("Voltar","homeNav"):"")+'<button type="button" class="v32-plus" data-action="newTrip" aria-label="Nova viagem" title="Nova viagem">+</button></div></div>'+(items.length?'<div class="grid">'+items.map(t=>'<article class="card trip passport-trip"><div class="trip-photo v32-cover" '+(t.cover&&/^data:image\/(?:jpeg|png|webp);base64,/.test(t.cover)?'style="background-image:url('+esc(t.cover)+')!important"':"")+'><button class="v32-editcover" type="button" data-action="cover:'+esc(t.id)+'" aria-label="Alterar imagem de capa">◉ &nbsp; Editar imagem</button></div><div class="row" style="justify-content:space-between"><span class="chip '+(archived?"archived":"ongoing")+'">'+(archived?"Arquivada":"Planejamento")+'</span><span class="muted">'+esc(t.transport||"A definir")+'</span></div><div><h2>'+esc(t.title)+'</h2><p class="muted">'+esc(t.destinations||"Destino a definir")+'</p><p class="muted">'+period(t)+'</p></div><div class="row"><span class="chip">'+t.events.length+' etapas</span><span class="chip">'+t.scenarios.length+' cenários</span></div><div class="foot"><div><div class="muted" style="font-size:11px">Previsão inicial</div><strong>'+fmt(cost(t,t.scenarios[0]?.id),t.currency)+'</strong></div>'+button("Abrir viagem","open:"+t.id,"")+'</div></article>').join("")+'</div>':'<div class="empty"><h3>'+(archived?"Nenhuma viagem arquivada":"Nenhuma viagem ainda")+'</h3><p>'+(archived?"O histórico aparecerá aqui.":"Crie um roteiro para começar.")+'</p><br>'+button("+ Criar viagem","newTrip","")+'</div>')}
function detail(){const t=trip();if(!t){route="home";return home(false)}if(!scenarioId)scenarioId=t.scenarios[0]?.id;let s=scenario(t);const predicted=cost(t,s?.id),actual=cost(t,s?.id,true);return '<div class="passport-heading">ORBITRIP / SUA VIAGEM</div><div class="top passport-page-title"><div><div class="eyebrow"><a href="#" data-action="back">Minhas viagens</a> / '+(t.archived?"ARQUIVADA":"PLANEJAMENTO")+'</div><h1>'+esc(t.title)+'</h1><p class="muted">'+esc(t.destinations||"Sem destino definido")+' · '+period(t)+' · '+esc(t.transport||"Transporte a definir")+'</p></div><div class="row">'+button("Editar viagem","editTrip")+button("Duplicar","duplicateTrip")+button(t.archived?"Reativar":"Arquivar",t.archived?"restore":"archive")+'</div></div><div class="statgrid"><div class="card stat"><div class="badge">Orçamento previsto</div><strong class="number">'+fmt(predicted,t.currency)+'</strong><span class="muted">Cenário selecionado</span></div><div class="card stat"><div class="badge">Valor realizado</div><strong class="number">'+fmt(actual,t.currency)+'</strong><span class="muted">Gastos registrados</span></div><div class="card stat"><div class="badge">Diferença</div><strong class="number">'+fmt(predicted-actual,t.currency)+'</strong><span class="muted">Previsto menos realizado</span></div><div class="card stat"><div class="badge">Programação</div><strong>'+t.events.length+'</strong><span class="muted">Atividades e deslocamentos</span></div></div><div class="toolbar"><div class="row"><span class="muted"><b>Cenário:</b></span><select class="selectmini" id="scenario-select">'+t.scenarios.map(x=>'<option value="'+x.id+'" '+(s?.id===x.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></div>'+button("+ Cenário","newScenario")+'</div><div class="tabs">'+[["route","Roteiro"],["map","Mapa interativo"],["budget","Despesas"],["calculator","Calculadora"],["compare","Cenários"],["shopping","Compras"],["import","Importar Excel"],["info","Informações"]].map(([id,label])=>'<button class="'+(tab===id?"active":"")+'" data-tab="'+id+'">'+label+'</button>').join("")+'</div>'+({route:renderRoute,map:renderMap,budget:renderBudget,calculator:renderCalculator,compare:renderCompare,shopping:renderShopping,import:renderImporter,info:renderInfo}[tab]||renderRoute)(t,s)}
function renderRoute(t,s){const events=t.events.filter(e=>!e.scenarioId||e.scenarioId===s.id).slice().sort((a,b)=>(a.day+" "+a.startTime).localeCompare(b.day+" "+b.startTime));let prev="";return '<div class="passport-heading">ROTEIRO / PROGRAMAÇÃO</div><div class="toolbar"><div><h2>Programação por dia</h2><p class="muted">Horários, atrações, hospedagens e deslocamentos.</p></div>'+button("+ Adicionar etapa","newEvent","")+'</div>'+(events.length?events.map(e=>{let h="";if(e.day!==prev){prev=e.day;h='<div class="journal-day"><b>'+date(e.day)+'</b><span>Agenda do dia</span></div>'}return h+'<article class="item journal-entry" style="--cat-color:'+categoryColor(e.category)+'"><div class="details"><div class="row"><span class="category-stamp">'+esc(e.category||"Atividade")+'</span><span class="muted">'+esc([e.startTime,e.endTime].filter(Boolean).join(" — "))+'</span></div><strong style="margin-top:9px">'+esc(e.title)+'</strong><div class="meta">'+esc(e.address||"")+(e.address&&e.notes?" · ":"")+esc(e.notes||"")+'</div>'+(e.url?'<a class="linksmall" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">Abrir link ↗</a>':"")+'</div><div class="row">'+(e.estimated?'<div class="amount">'+fmt(e.estimated,t.currency)+'</div>':"")+button("Editar","editEvent:"+e.id)+button("Excluir","removeEvent:"+e.id,"ghost danger")+'</div></article>'}).join(""):'<div class="empty"><h3>Nenhuma etapa neste cenário</h3><p>Adicione atividades, visitas, transportes ou hospedagens.</p></div>')+'<p class="note" style="margin-top:20px">Etapas marcadas como “Todos os cenários” aparecem em qualquer alternativa da viagem. Valores informados nas etapas são indicativos; o orçamento consolidado é calculado na aba Despesas.</p>'}
function renderBudget(t,s){const expenses=t.expenses.filter(e=>!e.scenarioId||e.scenarioId===s.id);const cats=[...new Set(expenses.map(e=>e.category))];return '<div class="toolbar"><div><h2>Orçamento e despesas</h2><p class="muted">Compare os valores planejados e os efetivamente gastos.</p></div>'+button("+ Adicionar despesa","newExpense","")+'</div><div class="two"><div class="list">'+(expenses.length?expenses.map(e=>'<article class="item"><div class="details"><span class="chip">'+esc(e.category)+'</span><strong style="margin-top:9px">'+esc(e.title)+'</strong><div class="meta">'+(e.day?date(e.day)+" · ":"")+(e.scenarioId?"Exclusivo deste cenário":"Todos os cenários")+'</div></div><div><div class="amount">'+fmt(e.planned,t.currency)+'</div><div class="meta">Real: '+fmt(e.actual,t.currency)+'</div><div class="actions">'+button("Editar","editExpense:"+e.id)+button("Excluir","removeExpense:"+e.id,"ghost danger")+'</div></div></article>').join(""):'<div class="empty"><h3>Sem despesas</h3><p>Cadastre hospedagem, alimentação, combustível, passagens e atrações.</p></div>')+'</div><div class="card"><h3>Distribuição do orçamento</h3>'+(cats.length?cats.map(c=>{const v=sum(expenses.filter(e=>e.category===c).map(e=>e.planned));return '<div class="summaryline"><span>'+esc(c)+'</span><strong>'+fmt(v,t.currency)+'</strong></div><div class="bar"><span style="width:'+Math.min(100,predictedPercent(v,cost(t,s.id)))+'%"></span></div>'}).join(""):'<p class="muted">Categorias aparecerão após o primeiro lançamento.</p>')+'</div></div>'}
function predictedPercent(x,total){return total?x/total*100:0}
function renderCompare(t,s){return '<div class="toolbar"><div><h2>Comparativo de cenários</h2><p class="muted">Alternativas de custo para a mesma viagem.</p></div>'+button("+ Criar cenário","newScenario","")+'</div><div class="grid">'+t.scenarios.map(x=>'<article class="card"><div class="row" style="justify-content:space-between"><span class="chip">'+(x.id===s?.id?"Selecionado":"Alternativa")+'</span></div><h2 style="margin-top:16px">'+esc(x.name)+'</h2><p class="muted">'+esc(x.notes||"Sem observações")+'</p><strong style="font-size:25px;display:block;margin:24px 0 3px">'+fmt(cost(t,x.id),t.currency)+'</strong><p class="muted">Orçamento estimado</p><div class="row" style="margin-top:18px">'+button("Selecionar","chooseScenario:"+x.id)+button("Editar","editScenario:"+x.id)+(t.scenarios.length>1?button("Excluir","removeScenario:"+x.id,"ghost danger"):"")+'</div></article>').join("")+'</div><p class="note" style="margin-top:20px">Uma despesa pode valer para todos os cenários ou apenas para um cenário. Despesas compartilhadas entram no cálculo de todos eles.</p>'}
function renderShopping(t,s){const items=t.shopping.filter(e=>!e.scenarioId||e.scenarioId===s.id);return '<div class="toolbar"><div><h2>Lista de compras</h2><p class="muted">Itens, quantidades, referências de preço e itens adquiridos.</p></div>'+button("+ Novo item","newItem","")+'</div>'+(items.length?'<div class="list">'+items.map(i=>'<article class="item"><div class="details"><strong>'+esc(i.title)+'</strong><div class="meta">'+esc(i.quantity||"")+" · "+esc(i.store||"Sem loja")+' · '+(i.bought?"Comprado":"Pendente")+'</div></div><div class="row"><strong>'+fmt(i.price,t.currency)+'</strong>'+button(i.bought?"Desmarcar":"Comprado","toggleItem:"+i.id)+button("Editar","editItem:"+i.id)+button("Excluir","removeItem:"+i.id,"ghost danger")+'</div></article>').join("")+'</div><div class="card" style="margin-top:15px"><b>Total da lista: '+fmt(sum(items.map(i=>i.price)),t.currency)+'</b></div>':'<div class="empty"><h3>Lista vazia</h3><p>Adicione produtos para a viagem.</p></div>')+'<p class="note" style="margin-top:18px">A lista de compras é independente do orçamento. Para contabilizá-la no custo total, registre o valor correspondente também em Despesas.</p>'}
function renderInfo(t){return '<div class="two"><div class="card"><div class="v32-info-cover" '+(t.cover&&/^data:image\/(?:png|jpeg|webp);base64,/.test(t.cover)?'style="background-image:url('+esc(t.cover)+')"':'')+'></div><div style="margin-bottom:15px">'+button('Alterar imagem de capa','cover:'+t.id)+'</div><h3>Dados gerais</h3>'+[['Nome',t.title],['Destinos',t.destinations],['Origem',t.origin],['Período',period(t)],['Participantes',t.travelers],['Transporte',t.transport],['Moeda',t.currency]].map(([k,v])=>'<div class="summaryline"><span class="muted">'+k+'</span><strong>'+esc(v||"—")+'</strong></div>').join("")+'</div><div class="card"><h3>Observações</h3><p style="white-space:pre-wrap">'+esc(t.notes||"Nenhuma observação registrada.")+'</p><hr style="border:0;border-top:1px solid #e7ebf0;margin:24px 0"><h3>Gerenciar viagem</h3><div class="row">'+button("Editar informações","editTrip")+button("Excluir viagem","deleteTrip","ghost danger")+'</div></div></div>'}
function dataPage(){return '<div class="top"><div><div class="eyebrow">SEGURANÇA E PORTABILIDADE</div><h1>Dados e backup</h1><p class="muted">Faça cópias de segurança e transporte seus roteiros para outro navegador.</p></div></div><div class="two"><div class="card"><h2>Exportar dados</h2><p class="muted">Baixa todas as viagens, cenários, despesas, roteiros e compras em um arquivo JSON.</p><br>'+button("Baixar backup JSON","export","")+'</div><div class="card"><h2>Importar dados</h2><p class="muted">Restaura um backup anteriormente exportado. Os dados existentes serão substituídos após confirmação.</p><br><label class="btn ghost" for="import-file">Selecionar JSON</label><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div></div><div class="card" style="margin-top:17px"><h3>Importante sobre o armazenamento</h3><p class="muted">Esta V1 salva os dados no armazenamento local do navegador. Os dados não são sincronizados automaticamente entre dispositivos, não são armazenados no GitHub e podem ser perdidos se o navegador for limpo. Exporte backups regularmente. Sincronização com login e banco de dados poderá ser incorporada em uma versão posterior.</p></div>'}
function field(label,name,value="",type="text",opts=""){if(type==="hidden")return '<input type="hidden" id="f_'+name+'" name="'+name+'" value="'+esc(value)+'">';return '<div class="field"><label for="f_'+name+'">'+label+'</label>'+(type==="textarea"?'<textarea id="f_'+name+'" name="'+name+'" '+opts+'>'+esc(value)+'</textarea>':type==="select"?'<select id="f_'+name+'" name="'+name+'" '+opts+'>'+value+'</select>':'<input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+opts+'>')+'</div>'}
function options(values,current){return values.map(v=>{const [key,label]=Array.isArray(v)?v:[v,v];return '<option value="'+esc(key)+'" '+(key===current?"selected":"")+'>'+esc(label)+'</option>'}).join("")}
function scope(t,val){return field("Válido para","scenarioId",options([["","Todos os cenários"],...t.scenarios.map(x=>[x.id,x.name])],val),"select")}
function modal(title,body,submit){document.getElementById("modal-root").innerHTML='<div class="modalbg"><section class="modal" role="dialog" aria-modal="true"><header><h2>'+esc(title)+'</h2><button type="button" data-action="close" aria-label="Fechar">×</button></header><form id="edit-form" data-submit="'+submit+'">'+body+'<div class="formfooter"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></section></div>';document.getElementById("edit-form").querySelector("input,select,textarea")?.focus()}
const close=()=>document.getElementById("modal-root").innerHTML="";
function tripForm(t){modal(t?"Editar viagem":"Nova viagem",'<div class="formgrid">'+field("Nome da viagem","title",t?.title||"","text","required")+field("Destinos","destinations",t?.destinations)+field("Origem","origin",t?.origin)+field("Participantes","travelers",t?.travelers)+field("Início","start",t?.start,"date")+field("Fim","end",t?.end,"date",t?.start?'min="'+esc(t.start)+'"':"")+field("Transporte","transport",options(["Carro","Avião","Trem","Ônibus","Navio","Misto","A definir"],t?.transport||"Carro"),"select")+field("Moeda","currency",options([["BRL","Real (BRL)"],["USD","Dólar (USD)"],["EUR","Euro (EUR)"],["CAD","Dólar canadense (CAD)"],["GBP","Libra (GBP)"]],t?.currency||"BRL"),"select")+'<div class="wide">'+field("Anotações gerais","notes",t?.notes,"textarea")+'</div></div>',"trip:"+(t?.id||"new"))}

function parseCoordinates(raw){
 const s=String(raw||"").trim();if(!s)return null;
 const pair=s.match(/^\s*(-?\d{1,3}(?:[.,]\d+)?)\s*[,;]\s*(-?\d{1,3}(?:[.,]\d+)?)\s*$/);
 if(pair){const lat=Number(pair[1].replace(",",".")),lon=Number(pair[2].replace(",","."));return Math.abs(lat)<=90&&Math.abs(lon)<=180?[lat,lon]:null}
 const d=s.match(/(\d{1,3})[°º]\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([NS])\s*[,; ]+\s*(\d{1,3})[°º]\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([EWLO])/i);
 if(!d)return null;const lat=(+d[1]+ +d[2]/60+ +d[3].replace(",",".")/3600)*(d[4].toUpperCase()==="S"?-1:1);const lon=(+d[5]+ +d[6]/60+ +d[7].replace(",",".")/3600)*(/[WO]/i.test(d[8])?-1:1);return Math.abs(lat)<=90&&Math.abs(lon)<=180?[lat,lon]:null
}

 const t=trip(),s=scenario(t),day=document.getElementById("map-day")?.value||"",cat=document.getElementById("map-category")?.value||"";

function getCalc(){
 const f=document.getElementById("calculator-form");if(!f)return null;const v={};new FormData(f).forEach((value,key)=>{v[key]=Number(value)||0});const mode=orbitCalcMode||"car";
 if(v.people<=0||v.days<=0||v.consumption<=0&&mode!=="plane"||v.nights<0){return {error:"Informe pessoas, dias e consumo maiores que zero."}}
 const rows=[];
 const add=(title,value)=>{if(value>0)rows.push({title,value})};
 add("Hospedagem",v.hotel*v.nights);add("Alimentação",v.food*v.people*v.days);add("Atrações e extras",v.extras);
 if(mode!=="plane"){add("Combustível",v.km/v.consumption*v.fuel);add("Pedágios",v.tolls);add("Aluguel de veículo",v.rental*v.rentalDays)}
 if(mode!=="car"){add("Passagens aéreas",v.ticket*v.people);add("Bagagens",v.bags);add("Traslados",v.transfer);add("Seguro",v.insurance)}
 const base=sum(rows.map(x=>x.value));add("Margem de segurança",base*Math.max(0,v.buffer)/100);

}

function excelDay(value,year=2027){

 for(const [idx,name] of workbook.SheetNames.entries()){
 const rows=XLSX.utils.sheet_to_json(workbook.Sheets[name],{header:1,defval:"",raw:false,blankrows:true});
 const nonempty=rows.filter(row=>row.some(c=>String(c).trim()));
 reports.push({name,rows:rows.length,sample:nonempty.slice(0,4).map(r=>r.slice(0,9)),events:0,expenses:0,shopping:0});
 const rp=reports[reports.length-1],lower=name.toLowerCase();
 if(idx===0){
 const title=String(rows[0]?.[3]||"").trim();if(title)draft.title=title;
 draft.travelers=String(rows[3]?.[3]||"").trim();
 const d=String(rows[3]?.[7]||"").split(/\s+/).filter(Boolean);
 if(d[0]){draft.start=excelDay(d[0]);sourceYear=Number(draft.start.slice(0,4))||sourceYear}
 if(d[1])draft.end=excelDay(d[1],sourceYear);
 draft.destinations=[rows[3]?.[8],rows[4]?.[8]].filter(Boolean).join(", ");
 }
 if(/roteiro/.test(lower)||idx<3&&workbook.SheetNames.length>=3){
 const id=uid(),label=scenarioKind(name);draft.scenarios.push({id,name:label,notes:"Origem: "+name});
 let currentDay=draft.start||"",added=0;
 for(let rowNo=7;rowNo<rows.length;rowNo++){
 const row=rows[rowNo]||[],day=excelDay(row[0],sourceYear);if(day)currentDay=day;
 const main=String(row[3]||"").trim(),geo=String(row[6]||"").trim();
 if(!main)continue;
 if(/^rio de janeiro$/i.test(main))continue;
 const time=main.match(/(?:partida|chegada|in[ií]cio|sa[ií]da)\s*:\s*(\d{1,2}:\d{2})/i)||main.match(/\b(\d{1,2}:\d{2})\b/);
 if(main.length<3)continue;
 const val=[row[8],row[7],row[4]].map(x=>Number(String(x).replace(/[R$\s]/g,"").replace(",","."))).find(x=>Number.isFinite(x)&&x>0)||0;
 draft.events.push({id:uid(),scenarioId:id,day:currentDay,startTime:time?.[1]||"",endTime:"",title:main.slice(0,220),category:/viagem|partida|chegada|deslocamento/i.test(main)?"Deslocamento":/hotel|hospedagem|pousada/i.test(main)?"Hospedagem":/restaurante|almo[cç]o|jantar|caf[eé]/i.test(main)?"Restaurante":"Atração",address:geo,estimated:val,notes:"Importado de "+name+" (linha "+(rowNo+1)+")",url:""});
 added++;
 }
 rp.events=added;
 }else if(/compras/i.test(lower)){
 for(let rowNo=7;rowNo<rows.length;rowNo++){
 const r=rows[rowNo]||[],title=String(r[2]||"").trim();if(!title||/^item$/i.test(title))continue;
 const value=Number(String(r[7]||0).replace(/[R$\s]/g,"").replace(",","."))||0;
 draft.shopping.push({id:uid(),scenarioId:"",title:title.slice(0,220),quantity:String(r[1]||"1"),price:Math.max(0,value),store:/vilefort/i.test(name)?"Vilefort":"",bought:false});rp.shopping++;
 }
 }else if(/despesa/i.test(lower)){
 for(let rowNo=7;rowNo<rows.length;rowNo++){
 const r=rows[rowNo]||[],description=String(r[3]||"").trim(),category=String(r[2]||"").trim();
 const value=Number(String(r[7]||0).replace(/[R$\s]/g,"").replace(",","."))||0;
 if(!description&&!category&&!value)continue;
 draft.expenses.push({id:uid(),scenarioId:"",title:(description||category||"Despesa importada").slice(0,220),category:category||"Outros",planned:Math.max(0,value),actual:0,day:excelDay(r[1],sourceYear)});rp.expenses++;
 }
 }
 }
 if(!draft.scenarios.length)draft.scenarios=[{id:uid(),name:"Principal",notes:""}];
 if(!draft.start)draft.start=new Date().toISOString().slice(0,10);
 return {draft,reports};
}
function parseWorkbook(){
 const f=document.getElementById("orbit-xlsx")?.files?.[0];if(!f){alert("Selecione um arquivo Excel.");return}
 if(!window.XLSX){alert("O leitor de Excel não foi carregado. Verifique sua conexão.");return}
 if(f.size>12*1024*1024){alert("Arquivo muito grande. Máximo: 12 MB.");return}
 f.arrayBuffer().then(buf=>{
  const book=XLSX.read(buf,{type:"array",cellDates:true}),p=workbookData(book);
  orbitPreview=p;orbitImportName=f.name;
  const el=document.getElementById("import-preview");if(!el)return;
  el.innerHTML='<div class="card" style="margin-top:18px"><h3>Prévia da importação · '+esc(f.name)+'</h3><p class="muted">Será criada uma nova viagem com os seguintes dados. Confira os registros antes de confirmar.</p><div class="row" style="margin:15px 0"><span class="chip">'+p.draft.scenarios.length+' cenários</span><span class="chip">'+p.draft.events.length+' etapas</span><span class="chip">'+p.draft.shopping.length+' compras</span><span class="chip">'+p.draft.expenses.length+' despesas</span></div><div class="previewscroll"><table class="previewtable"><thead><tr><th>Aba</th><th>Etapas</th><th>Compras</th><th>Despesas</th></tr></thead><tbody>'+p.reports.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.events+'</td><td>'+r.shopping+'</td><td>'+r.expenses+'</td></tr>').join("")+'</tbody></table></div><p class="note" style="margin:16px 0">A importação interpreta campos reconhecíveis da planilha. Fórmulas, formatação e algumas informações sem coluna estruturada não são reproduzidas. Revise cada atividade após importar. Nenhuma informação foi gravada ainda.</p><label class="field"><label>Nome da nova viagem</label><input id="import-title" value="'+esc(p.draft.title)+'"></label><div style="margin-top:13px">'+button("Confirmar e criar viagem","importConfirm","")+'</div></div>';
 }).catch(err=>alert("Não foi possível ler a planilha: "+err.message));
}
function confirmImport(){
 if(!orbitPreview)return;const title=document.getElementById("import-title")?.value?.trim();if(!title){alert("Informe o nome da viagem.");return}
 const draft=orbitPreview.draft;const t={...draft,id:uid(),title,archived:false,notes:"Arquivo original: "+orbitImportName+"\n"+draft.notes};
 db.trips.push(t);save();orbitPreview=null;tripId=t.id;scenarioId=t.scenarios[0].id;route="trip";tab="route";render();alert("Viagem importada. Confira horários, custos e localizações antes de utilizá-la.");
}


let geoTimer=null,geoAbort=null,geoCandidates=[];
function syncTripDates(target){
 const form=target?.closest("#edit-form");if(!form||!form.dataset.submit.startsWith("trip:"))return;
 const start=form.elements.namedItem("start"),end=form.elements.namedItem("end");
 if(!start||!end)return;
 end.min=start.value||"";
 if(start.value&&end.value&&end.value<start.value)end.value="";
}
function formatPhotonFeature(feature){
 const p=feature.properties||{},c=feature.geometry?.coordinates||[];
 return {latitude:Number(c[1]),longitude:Number(c[0]),name:p.name||p.street||p.city||"Local",address:[p.name,[p.housenumber,p.street].filter(Boolean).join(" "),p.city,p.state,p.country].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i).join(", ")};
}
async function searchGeo(query){
 const out=document.getElementById("geo-results"),badge=document.getElementById("geo-badge");
 if(!out)return;
 if(geoAbort)geoAbort.abort();
 if(query.length<3){out.hidden=true;out.innerHTML="";return}
 geoAbort=new AbortController();
 out.hidden=false;out.innerHTML='<div class="geo-help" style="padding:10px">Pesquisando lugares…</div>';
 try{
  const url="https://photon.komoot.io/api/?q="+encodeURIComponent(query)+"&limit=5";
  const response=await fetch(url,{signal:geoAbort.signal,headers:{"Accept":"application/json"}});
  if(!response.ok)throw Error(response.status===429?"Limite de consultas atingido. Tente novamente em instantes.":"Serviço temporariamente indisponível ("+response.status+")");
  const result=await response.json();
  geoCandidates=(result.features||[]).map(formatPhotonFeature).filter(x=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));
  out.innerHTML=geoCandidates.length?geoCandidates.map((x,i)=>'<button class="geo-result" type="button" data-geo-index="'+i+'" role="option"><b>'+esc(x.name)+'</b><small>'+esc(x.address)+'</small></button>').join(""):'<div class="geo-help" style="padding:10px">Nenhum resultado. Tente informar cidade, país ou endereço mais completo.</div>';
  if(badge)badge.textContent="Resultados de Photon · dados OpenStreetMap";
 }catch(err){if(err.name==="AbortError")return;if(badge)badge.textContent=err.message||"Falha na busca";out.innerHTML='<div class="geo-help" style="padding:10px">Busca indisponível. Você ainda pode inserir um endereço ou coordenadas manualmente.</div>'}
}
document.addEventListener("input",e=>{
 if(e.target.id==="f_start"){syncTripDates(e.target)}
 if(e.target.id==="f_address"){
  const form=e.target.closest("#edit-form");if(!form||!form.dataset.submit.startsWith("event:"))return;
  const lat=form.elements.namedItem("latitude"),lon=form.elements.namedItem("longitude");
  if(lat)lat.value="";if(lon)lon.value="";
  const b=document.getElementById("geo-badge");if(b)b.textContent="Selecione um lugar sugerido para vincular coordenadas.";
  clearTimeout(geoTimer);
  const query=e.target.value.trim();
  if(query.length<3){const box=document.getElementById("geo-results");if(box){box.hidden=true;box.innerHTML=""}return}
  geoTimer=setTimeout(()=>searchGeo(query),850);
 }
});
document.addEventListener("change",e=>{if(e.target.id==="f_start"){syncTripDates(e.target);const end=document.getElementById("f_end");if(end&&e.target.value){try{end.focus();end.showPicker?.()}catch{end.focus()}}}});
document.addEventListener("click",e=>{
 const choice=e.target.closest("[data-geo-index]");if(!choice)return;
 const data=geoCandidates[Number(choice.dataset.geoIndex)];if(!data)return;
 const form=document.getElementById("edit-form");if(!form)return;
 form.elements.namedItem("address").value=data.address;
 form.elements.namedItem("latitude").value=data.latitude;
 form.elements.namedItem("longitude").value=data.longitude;
 const box=document.getElementById("geo-results");if(box){box.hidden=true;box.innerHTML=""}
 const badge=document.getElementById("geo-badge");if(badge)badge.textContent="✓ Local vinculado ao mapa · "+data.latitude.toFixed(5)+", "+data.longitude.toFixed(5);
});


let coverTripId=null,coverImage=null;
function openCoverEditor(id){
 const t=db.trips.find(x=>x.id===id);if(!t)return;
 coverTripId=id;coverImage=null;
 document.getElementById("modal-root").innerHTML='<div class="modalbg"><section class="modal" role="dialog" aria-modal="true" aria-label="Editar imagem de capa"><header><h2>Imagem de capa</h2><button data-action="close" aria-label="Fechar">×</button></header><div class="field"><label for="cover-file">Escolher fotografia</label><input type="file" id="cover-file" accept="image/jpeg,image/png,image/webp"></div><canvas id="cover-canvas" width="1000" height="563" class="v32-cover-preview" aria-label="Prévia do enquadramento"></canvas><div class="v32-controls"><label for="cover-zoom">Ampliar</label><input type="range" min="100" max="250" value="100" id="cover-zoom"><label for="cover-x">Posição horizontal</label><input type="range" min="-100" max="100" value="0" id="cover-x"><label for="cover-y">Posição vertical</label><input type="range" min="-100" max="100" value="0" id="cover-y"></div><p class="v32-cover-note">Enquadramento 16:9. A fotografia será comprimida e salva neste navegador, inclusive no backup JSON.</p><div class="formfooter">'+button("Remover capa","coverRemove","ghost danger")+button("Cancelar","close")+button("Salvar imagem","coverSave","")+'</div></section></div>';
 if(t.cover){const image=new Image();image.onload=()=>{if(coverTripId===id){coverImage=image;drawCover()}};image.src=t.cover}else drawCover();
}
function drawCover(){
 const canvas=document.getElementById("cover-canvas");if(!canvas)return;
 const ctx=canvas.getContext("2d");if(!ctx)return;
 const w=canvas.width,h=canvas.height;ctx.fillStyle="#eeeeee";ctx.fillRect(0,0,w,h);
 if(!coverImage){ctx.fillStyle="#777";ctx.font="22px sans-serif";ctx.textAlign="center";ctx.fillText("Escolha uma fotografia",w/2,h/2);return}
 const zoom=Number(document.getElementById("cover-zoom")?.value||100)/100;
 const scale=Math.max(w/coverImage.naturalWidth,h/coverImage.naturalHeight)*zoom;
 const iw=coverImage.naturalWidth*scale,ih=coverImage.naturalHeight*scale;
 const ox=(Number(document.getElementById("cover-x")?.value||0)+100)/200,oy=(Number(document.getElementById("cover-y")?.value||0)+100)/200;
 ctx.drawImage(coverImage,-Math.max(0,iw-w)*ox,-Math.max(0,ih-h)*oy,iw,ih);
}
function saveCover(){
 const t=db.trips.find(x=>x.id===coverTripId);if(!t||!coverImage){alert("Selecione uma imagem.");return}
 drawCover();
 const prev=t.cover;t.cover=document.getElementById("cover-canvas").toDataURL("image/jpeg",0.78);
 try{save()}catch(e){t.cover=prev;alert("Armazenamento insuficiente. Salve um backup e experimente uma foto menor.");return}
 coverTripId=null;coverImage=null;close();render();
}
function removeCover(){
 const t=db.trips.find(x=>x.id===coverTripId);if(!t)return;
 if(!confirm("Restaurar imagem padrão desta viagem?"))return;
 const prev=t.cover;delete t.cover;
 try{save()}catch(e){t.cover=prev;alert("Falha ao salvar.");return}
 coverTripId=null;coverImage=null;close();render();
}
document.addEventListener("change",e=>{
 if(e.target.id!=="cover-file")return;
 const file=e.target.files?.[0];if(!file)return;
 if(!/^image\/(?:jpeg|png|webp)$/.test(file.type)||file.size>12*1024*1024){alert("Selecione JPG, PNG ou WebP de até 12 MB.");return}
 const reader=new FileReader();
 reader.onload=()=>{
  const im=new Image();
  im.onload=()=>{coverImage=im;["cover-x","cover-y"].forEach(id=>document.getElementById(id).value="0");document.getElementById("cover-zoom").value="100";drawCover()};
  im.onerror=()=>alert("Não foi possível abrir a fotografia.");im.src=String(reader.result);
 };
 reader.readAsDataURL(file);
});
document.addEventListener("input",e=>{if(["cover-zoom","cover-x","cover-y"].includes(e.target.id))drawCover()});

render();
if(route==="trip"&&tab==="calculator")setTimeout(calculateLive,0);
})();
</script>
