@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',Inter,system-ui,sans-serif;background:#f4f7fa;color:#112842}
h1,h2,h3,.brand{font-family:Outfit,'DM Sans',sans-serif}
.sidebar{background:linear-gradient(170deg,#08182e,#12395c 72%,#0b233c);box-shadow:8px 0 30px #0b28410a}
.brand{font-size:25px;letter-spacing:.08em}.brand small{color:#69ded2}
.nav button.active{background:linear-gradient(90deg,#31bfb51e,#4a89ff20);border-left:3px solid #35d0c1}
.main{max-width:1540px}.eyebrow{color:#179b9c}
.btn{background:#153e62}.btn:hover{background:#23648d}
.btn.primary{background:linear-gradient(120deg,#164b76,#0a9eaa);box-shadow:0 7px 24px #1288a12c}
.card{border-color:#e3ebf3;box-shadow:0 12px 32px #12345608}
.card,.item{transition:transform .22s ease,box-shadow .22s ease}
.card:hover{box-shadow:0 17px 42px #12345612}
.trip:hover{transform:translateY(-3px)}
.stat strong{color:#133b5c}.chip.ongoing{background:#dff8f4;color:#0d7f7c}
.orbit-hero{overflow:hidden;position:relative;isolation:isolate;color:white;border-radius:23px;min-height:230px;margin-bottom:22px;padding:34px 38px;background:linear-gradient(92deg,#081c36df,#0e3b5ba0 56%,#08274320),url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1600&auto=format&fit=crop&q=85') center 45%/cover}
.orbit-hero:after{content:'';position:absolute;right:4%;top:-100px;width:380px;height:380px;border:1px solid #ffffff44;border-radius:50%;box-shadow:0 0 0 65px #ffffff0b,0 0 0 130px #ffffff08;z-index:-1;pointer-events:none}
.orbit-hero h1{font-size:clamp(34px,5vw,57px);letter-spacing:-.045em;max-width:660px;line-height:1.04;margin:13px 0}
.orbit-hero p{max-width:520px;color:#e7f4fa;font-size:15px;line-height:1.6}
.orbit-hero .eyebrow{color:#80fff0}.orbit-hero .btn{background:white;color:#144160}
.trip-photo{height:125px;margin:-22px -22px 8px;border-radius:16px 16px 0 0;background:linear-gradient(135deg,#12446890,#35d0c155),url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=700&auto=format&fit=crop&q=80') center/cover}
.trip:nth-child(3n+2) .trip-photo{background-image:linear-gradient(135deg,#12446870,#35d0c133),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700&auto=format&fit=crop&q=80')}
.trip:nth-child(3n) .trip-photo{background-image:linear-gradient(135deg,#12446870,#35d0c133),url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=700&auto=format&fit=crop&q=80')}
.orbit-subhead{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin:0 0 17px}
#orbit-map{height:min(68vh,620px);min-height:360px;z-index:0;border-radius:15px;background:#dbeaf0}
.map-grid{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);gap:16px}
.map-side{max-height:660px;overflow:auto}.map-side .map-entry{width:100%;text-align:left;padding:12px;background:white;border:1px solid #e2ebf1;border-radius:10px;margin:0 0 9px}
.map-side .map-entry:hover{border-color:#21a6ac;background:#f3fbfa}
.map-legend{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.map-legend select{width:auto}
.orbit-marker{background:#0e8498;border:3px solid white;color:white;display:grid;place-items:center;font-weight:800;border-radius:50%;box-shadow:0 3px 11px #103c6070}
.calcgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:19px}.calc-total{background:linear-gradient(145deg,#0d2d4b,#11657d);color:#fff;border-radius:18px;padding:27px}.calc-total strong{font-size:32px;display:block;margin:12px 0}.calc-total .muted{color:#c9e2ef}
.importbox{border:2px dashed #a4c6d7;border-radius:17px;padding:26px;background:#f5fbfc;text-align:center;margin-top:16px}
.previewtable{width:100%;border-collapse:collapse;font-size:12px}.previewtable th,.previewtable td{border-bottom:1px solid #e5edf1;padding:8px;text-align:left;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@keyframes orbitRise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
.main>.top,.main>.orbit-hero,.main>.grid,.main>.statgrid,.main>.tabs{animation:orbitRise .35s ease both}

@media(max-width:850px){.map-grid,.calcgrid{grid-template-columns:1fr}.map-side{max-height:240px}.orbit-hero{padding:24px;min-height:230px}}


/* ORBITRIP 3.1 — visual editorial minimalista, mobile-first */
:root{--bg:#F5F7F7;--surface:#FFFFFF;--ink:#152A33;--muted:#6B8087;--line:#E3E9EA;--accent:#087E7B;--accent-pale:#E7F5F1;--category-attraction:#3673C9;--category-stay:#268659;--category-move:#D34B4D;--category-food:#BD8A18;font-family:'DM Sans',Inter,system-ui,sans-serif!important;color:var(--ink);background:var(--bg)}

.top{margin-bottom:23px}

a{color:var(--accent)}

function routeDestination(e){
 if(e.category==="Deslocamento"&&String(e.routeDestination||"").trim())return String(e.routeDestination).trim();
 const lat=Number(e.latitude),lon=Number(e.longitude);
 if(e.latitude!=null&&e.latitude!==""&&e.longitude!=null&&e.longitude!==""&&Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180)return lat+","+lon;
 return String(e.address||"").trim();
}
function routeMapUrls(e){
 const origin=String(e.routeOrigin||"").trim(),destination=String(e.routeDestination||"").trim();
 if(e.category==="Deslocamento"&&origin&&destination){
  const validModes=["driving","walking","transit","bicycling"];
  const mode=validModes.includes(e.routeMode)?e.routeMode:"driving";
  const stops=routeStops(e.routeWaypoints).slice(0,3);
  const google="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(origin)
    +"&destination="+encodeURIComponent(destination)+"&travelmode="+mode
    +(stops.length?"&waypoints="+encodeURIComponent(stops.join("|")):"");
  const apple="https://maps.apple.com/directions?source="+encodeURIComponent(origin)
    +"&destination="+encodeURIComponent(destination)
    +stops.map(x=>"&waypoint="+encodeURIComponent(x)).join("")
    +"&mode="+(mode==="bicycling"?"cycling":mode);
  return {apple,google};
 }
 const dest=routeDestination(e);if(!dest)return null;
 return {
  apple:"https://maps.apple.com/?daddr="+encodeURIComponent(dest)+"&dirflg=d",
  google:"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest)+"&travelmode=driving"
 };
}
function navigationLinks(e){
 const urls=routeMapUrls(e);if(!urls)return "";
 const name=esc(e.title||"deslocamento"),routeReady=e.category==="Deslocamento"&&e.routeOrigin&&e.routeDestination;
 return '<div class="orbi-maplinks"><a href="'+esc(urls.apple)+'" target="_blank" rel="noopener noreferrer" aria-label="'+(routeReady?"Abrir rota de ":"Navegar até ")+name+' no Mapas da Apple">Mapas da Apple</a><a href="'+esc(urls.google)+'" target="_blank" rel="noopener noreferrer" aria-label="'+(routeReady?"Abrir rota de ":"Navegar até ")+name+' no Google Maps">Google Maps</a></div>';
}
function nextStop(){

 const s=scenario(t),now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,"0"),String(now.getDate()).padStart(2,"0")].join("-");
 const cur=now.toTimeString().slice(0,5);
 const events=t.events.filter(e=>(!e.scenarioId||e.scenarioId===s.id)&&routeDestination(e))
   .sort((a,b)=>(a.day+" "+(a.startTime||"00:00")).localeCompare(b.day+" "+(b.startTime||"00:00")));
 const e=events.find(x=>x.day>today||(x.day===today&&(!x.startTime||x.startTime>=cur)));
 if(!e){alert("Não há outra parada futura com endereço ou coordenadas neste cenário.");return}

}

ticle>'}).join(""):'<div class="empty"><h3>Nenhuma etapa neste cenário</h3><p>Adicione atividades, visitas, transportes ou hospedagens.</p></div>')+'<p class="note" style="margin-top:20px">Etapas marcadas como “Todos os cenários” aparecem em qualquer alternativa da viagem. Os valores previstos das etapas são somados ao orçamento sem duplicar despesas correspondentes.</p>'}

function splitTravelers(value){

}

const getObj=f=>Object.fromEntries(new FormData(f).entries());
function submit(form){const [kind,id]=form.dataset.submit.split(":");if(cloudActive&&cloudRoles[tripId]==="viewer"&&!(kind==="trip"&&id==="new")){alert("Viagem somente para leitura.");return}const v=getObj(form);const t=trip();
 const oldStage=kind==="event"&&id!=="new"?t?.events.find(x=>x.id===id):null;
 const oldExpense=kind==="expense"&&id!=="new"?t?.expenses.find(x=>x.id===id):null;
 const priorStageValue=oldStage?money(oldStage.estimated):null;
 const priorExpenseValue=oldExpense?money(oldExpense.planned):null;
 if(kind==="trip"){v.travelers=Array.from(form.querySelectorAll("[data-orbi-traveler]")).map(el=>el.value.trim()).filter(Boolean).join(", ");if(v.start&&v.end&&v.end<v.start){alert("A data final deve ser posterior à inicial.");return}if(id==="new"){const x={...v,id:uid(),archived:false,scenarios:[{id:uid(),name:"Principal",notes:""}],events:[],expenses:[],shopping:[]};db.trips.push(x);tripId=x.id;route="trip";scenarioId=x.scenarios[0].id}else Object.assign(t,v)}else if(kind==="scenario"){const x={...v,id:id==="new"?uid():id};if(id==="new"){t.scenarios.push(x);scenarioId=x.id}else Object.assign(t.scenarios.find(z=>z.id===id),v)}else {const list={event:"events",expense:"expenses",item:"shopping"}[kind];const normalized={...v};if(kind==="event"){if(v.category==="Deslocamento"){
 normalized.routeOrigin=String(v.routeOrigin||"").trim();
 normalized.routeDestination=String(v.routeDestination||"").trim();
 const routePoints=routeStops(v.routeWaypoints);
 if(routePoints.length>3){alert("A rota permite até três paradas intermediárias.");return}
 if(routePoints.some(x=>x.length>180)){alert("Cada parada intermediária deve ter até 180 caracteres.");return}
 if((normalized.routeOrigin||normalized.routeDestination||routePoints.length)&&(!normalized.routeOrigin||!normalized.routeDestination)){
  alert("Para cadastrar a rota, informe origem e destino.");return
 }
 normalized.routeWaypoints=routePoints.join("\n");
 normalized.routeMode=["driving","walking","transit","bicycling"].includes(v.routeMode)?v.routeMode:"driving";
 if(normalized.routeDestination&&!String(v.address||"").trim())normalized.address=normalized.routeDestination;
}
normalized.estimated=money(v.estimated);normalized.latitude=v.latitude!==""&&Number.isFinite(Number(v.latitude))?Number(v.latitude):null;normalized.longitude=v.longitude!==""&&Number.isFinite(Number(v.longitude))?Number(v.longitude):null;if(v.url&&!/^https?:\/\//i.test(v.url)){alert("O link deve começar com http:// ou https://");return}}if(kind==="expense"){normalized.planned=money(v.planned);normalized.actual=money(v.actual)}if(kind==="item"){normalized.price=money(v.price);normalized.bought=id==="new"?false:t.shopping.find(z=>z.id===id)?.bought}if(id==="new")t[list].push({...normalized,id:uid()});else Object.assign(t[list].find(z=>z.id===id),normalized);
 /* Atualiza os dois cadastros quando representam a mesma despesa.
    Editar apenas o realizado não sobrescreve o preço previsto da etapa. */
 if(kind==="event"&&(id==="new"&&money(normalized.estimated)>0||id!=="new"&&money(normalized.estimated)!==priorStageValue)){
  const stage=id==="new"?t.events[t.events.length-1]:t.events.find(x=>x.id===id);
  if(stage)for(const expense of t.expenses){
   const linked=budgetLinkedEvent(t,expense,expense.scenarioId);
   if(linked?.id===stage.id)expense.planned=money(stage.estimated);
  }
 }
 if(kind==="expense"&&(id==="new"||money(normalized.planned)!==priorExpenseValue)){
  const expense=id==="new"?t.expenses[t.expenses.length-1]:t.expenses.find(x=>x.id===id);
  if(expense){
   const stage=budgetLinkedEvent(t,expense,expense.scenarioId);
   if(stage)stage.estimated=money(expense.planned);
  }
 }
 }save();close();render()}
function duplicateEvent(id){
 const t=trip();if(!t)return;
 if(cloudActive&&cloudRoles[t.id]==="viewer"){alert("Esta viagem permite apenas visualização.");return}
 const i=t.events.findIndex(e=>e.id===id);if(i<0)return;
 const original=t.events[i],copy=JSON.parse(JSON.stringify(original));
 copy.id=uid();
 /* Não reutilizar a referência de importação; a cópia é uma nova etapa. */
 delete copy.sourceRow;
 copy.title=String(original.title||"Etapa")+" (cópia)";
 t.events.splice(i+1,0,copy);
 save();render();
}

function parseCoordinates(raw){
 const s=String(raw||"").trim();if(!s)return null;
 const pair=s.match(/^\s*(-?\d{1,3}(?:[.,]\d+)?)\s*[,;]\s*(-?\d{1,3}(?:[.,]\d+)?)\s*$/);
 if(pair){const lat=Number(pair[1].replace(",",".")),lon=Number(pair[2].replace(",","."));return Math.abs(lat)<=90&&Math.abs(lon)<=180?[lat,lon]:null}
 const d=s.match(/(\d{1,3})[°º]\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([NS])\s*[,; ]+\s*(\d{1,3})[°º]\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([EWLO])/i);
 if(!d)return null;const lat=(+d[1]+ +d[2]/60+ +d[3].replace(",",".")/3600)*(d[4].toUpperCase()==="S"?-1:1);const lon=(+d[5]+ +d[6]/60+ +d[7].replace(",",".")/3600)*(/[WO]/i.test(d[8])?-1:1);return Math.abs(lat)<=90&&Math.abs(lon)<=180?[lat,lon]:null
}

 reports.push({name,rows:rows.length,sample:nonempty.slice(0,4).map(r=>r.slice(0,9)),events:0,expenses:0,shopping:0});
 const rp=reports[reports.length-1],lower=name.toLowerCase();
 if(idx===0){

 if(d[0]){draft.start=excelDay(d[0]);sourceYear=Number(draft.start.slice(0,4))||sourceYear}
 if(d[1])draft.end=excelDay(d[1],sourceYear);

 }
 if(/roteiro/.test(lower)||idx<3&&workbook.SheetNames.length>=3){

function formatPhotonFeature(feature){
 const p=feature.properties||{},c=feature.geometry?.coordinates||[];
 return {latitude:Number(c[1]),longitude:Number(c[0]),name:p.name||p.street||p.city||"Local",address:[p.name,[p.housenumber,p.street].filter(Boolean).join(" "),p.city,p.state,p.country].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i).join(", ")};
}
async function searchGeo(query){
 const out=document.getElementById("geo-results"),badge=document.getElementById("geo-badge");
 if(!out)return;
 if(geoAbort)geoAbort.abort();
 if(query.length<3){out.hidden=true;out.innerHTML="";return}
 geoAbort=new AbortController();
 out.hidden=false;out.innerHTML='<div class="geo-help" style="padding:10px">Pesquisando lugares…</div>';
 try{
  const url="https://photon.komoot.io/api/?q="+encodeURIComponent(query)+"&limit=5";
  const response=await fetch(url,{signal:geoAbort.signal,headers:{"Accept":"application/json"}});
  if(!response.ok)throw Error(response.status===429?"Limite de consultas atingido. Tente novamente em instantes.":"Serviço temporariamente indisponível ("+response.status+")");
  const result=await response.json();
  geoCandidates=(result.features||[]).map(formatPhotonFeature).filter(x=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));
  geoSelectedIndex=-1;out.innerHTML=geoCandidates.length?geoCandidates.map((x,i)=>'<button class="geo-result" type="button" data-geo-index="'+i+'" role="option" aria-selected="false"><span class="geo-result-icon" aria-hidden="true">⌕</span><span class="geo-result-body"><b>'+esc(x.name)+'</b><small>'+esc(x.address)+'</small></span></button>').join(""):'<div class="geo-help" style="padding:12px">Nenhum resultado. Tente cidade e estado.</div>';const input=document.getElementById("f_address");if(input)input.setAttribute("aria-expanded",geoCandidates.length?"true":"false");
  if(badge)badge.textContent="Resultados de Photon · dados OpenStreetMap";
 }catch(err){if(err.name==="AbortError")return;if(badge)badge.textContent=err.message||"Falha na busca";out.innerHTML='<div class="geo-help" style="padding:10px">Busca indisponível. Você ainda pode inserir um endereço ou coordenadas manualmente.</div>'}
}

 }

function drawCover(){
 const canvas=document.getElementById("cover-canvas");if(!canvas)return;
 const ctx=canvas.getContext("2d");if(!ctx)return;
 const w=canvas.width,h=canvas.height;ctx.fillStyle="#eeeeee";ctx.fillRect(0,0,w,h);
 if(!coverImage){ctx.fillStyle="#777";ctx.font="22px sans-serif";ctx.textAlign="center";ctx.fillText("Escolha uma fotografia",w/2,h/2);return}
 const zoom=Number(document.getElementById("cover-zoom")?.value||100)/100;
 const scale=Math.max(w/coverImage.naturalWidth,h/coverImage.naturalHeight)*zoom;
 const iw=coverImage.naturalWidth*scale,ih=coverImage.naturalHeight*scale;
 const ox=(Number(document.getElementById("cover-x")?.value||0)+100)/200,oy=(Number(document.getElementById("cover-y")?.value||0)+100)/200;
 ctx.drawImage(coverImage,-Math.max(0,iw-w)*ox,-Math.max(0,ih-h)*oy,iw,ih);
}

 drawCover();
 const prev=t.cover;t.cover=document.getElementById("cover-canvas").toDataURL("image/jpeg",0.78);
 try{save()}catch(e){t.cover=prev;alert("Armazenamento insuficiente. Salve um backup e experimente uma foto menor.");return}
 coverTripId=null;coverImage=null;close();render();
}

/* Segurança de sincronização: rebase de alterações independentes, sem sobrescrever
   alterações simultâneas no mesmo campo. As revisões são validadas pelo servidor. */
const ORBI_MERGE_CONFLICT=Symbol("ORBI_MERGE_CONFLICT");
function cloudStable(value){
 if(value===undefined)return "<undefined>";
 if(Array.isArray(value))return "["+value.map(cloudStable).join(",")+"]";
 if(value&&typeof value==="object")return "{"+Object.keys(value).sort().map(k=>JSON.stringify(k)+":"+cloudStable(value[k])).join(",")+"}";
 return JSON.stringify(value);
}
function cloudEqual(a,b){return cloudStable(a)===cloudStable(b)}
function cloudCopy(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v))}
function cloudMergeValue(base,local,remote,path=[]){
 if(cloudEqual(local,base))return cloudCopy(remote);
 if(cloudEqual(remote,base)||cloudEqual(local,remote))return cloudCopy(local);
 if(path.length>30)return ORBI_MERGE_CONFLICT;
 if(Array.isArray(base)&&Array.isArray(local)&&Array.isArray(remote)){
  if(!["events","expenses","shopping","scenarios"].includes(path[path.length-1]))return ORBI_MERGE_CONFLICT;
  const keyed=a=>a.every(x=>x&&typeof x==="object"&&typeof x.id==="string")
   &&new Set(a.map(x=>x.id)).size===a.length;
  if(!keyed(base)||!keyed(local)||!keyed(remote))return ORBI_MERGE_CONFLICT;
  const bm=new Map(base.map(x=>[x.id,x])),lm=new Map(local.map(x=>[x.id,x])),rm=new Map(remote.map(x=>[x.id,x]));
  const ids=[...new Set([...remote.map(x=>x.id),...local.map(x=>x.id),...base.map(x=>x.id)])],merged=[];
  for(const id of ids){
   const next=cloudMergeValue(bm.get(id),lm.get(id),rm.get(id),[...path,id]);
   if(next===ORBI_MERGE_CONFLICT)return next;
   if(next!==undefined)merged.push(next);
  }
  return merged;
 }
 const plain=v=>v&&typeof v==="object"&&!Array.isArray(v);
 if(plain(local)&&plain(remote)&&(plain(base)||base===undefined)){
  const out={};
  for(const key of new Set([...Object.keys(base||{}),...Object.keys(local),...Object.keys(remote)])){
   if(key==="__proto__"||key==="constructor"||key==="prototype")return ORBI_MERGE_CONFLICT;
   const value=cloudMergeValue(base?.[key],local[key],remote[key],[...path,key]);
   if(value===ORBI_MERGE_CONFLICT)return value;
   if(value!==undefined)out[key]=value;
  }
  return out;
 }
 return ORBI_MERGE_CONFLICT;
}
async function cloudWriteSafely(t,payload,revision){
 const submitted=JSON.stringify(payload);
 const persist=async(data,rev)=>({revision:Number(await cloudApi.write(data,rev,cloudUser.id)),saved:JSON.stringify(data),merged:data});
 try{
  const result=await persist(payload,revision);
  return {...result,rebased:false,submitted};
 }catch(err){
  if(revision==null||!/CONFLICT_OR_DENIED/.test(String(err?.message)))throw err;
  const remote=await cloudApi.getTrip(t.id);
  const baseString=cloudSaved.get(t.id);
  if(!remote||!baseString)throw err;
  let base;
  try{base=JSON.parse(baseString)}catch{throw err}
  let combined=cloudMergeValue(base,payload,remote.payload);
  if(combined===ORBI_MERGE_CONFLICT)combined=cloudMergeAdditions(remote.payload,payload);
  if(combined===ORBI_MERGE_CONFLICT||!combined||combined.id!==t.id)throw err;
  const result=await persist(combined,Number(remote.revision));
  return {...result,rebased:true,submitted};
 }
}

/* Reaproveita rascunhos anteriores sem sobrescrever campos modificados na nuvem.
   Só combina coleções por ID quando os itens já existentes são idênticos. */
function cloudMergeAdditions(remote,local){
 if(!remote||!local||remote.id!==local.id)return ORBI_MERGE_CONFLICT;
 const collections=new Set(["events","expenses","shopping","scenarios"]);
 const out=cloudCopy(remote);
 for(const key of new Set([...Object.keys(remote),...Object.keys(local)])){
  if(!collections.has(key)){
   if(!cloudEqual(remote[key],local[key]))return ORBI_MERGE_CONFLICT;
   continue;
  }
  const r=remote[key],l=local[key];
  if(!Array.isArray(r)||!Array.isArray(l))return ORBI_MERGE_CONFLICT;
  const keyed=arr=>arr.every(x=>x&&typeof x==="object"&&typeof x.id==="string")
    &&new Set(arr.map(x=>x.id)).size===arr.length;
  if(!keyed(r)||!keyed(l))return ORBI_MERGE_CONFLICT;
  const present=new Map(r.map(x=>[x.id,x])),localIds=new Set(l.map(x=>x.id));
  /* Nunca interpretar exclusões locais como simples adições. */
  if(r.some(item=>!localIds.has(item.id)))return ORBI_MERGE_CONFLICT;
  for(const item of l){
   if(present.has(item.id)&&!cloudEqual(present.get(item.id),item))return ORBI_MERGE_CONFLICT;
  }
  out[key]=[...r.map(cloudCopy),...l.filter(x=>!present.has(x.id)).map(cloudCopy)];
 }
 return out;
}
function cloudRecoveryId(originalId){
 const key="orbitrip-recovery-id-"+cloudUser.id+"-"+originalId;
 let id=localStorage.getItem(key);
 if(!id){id=uid();localStorage.setItem(key,id)}
 return id;
}
/* Chamado após ler a nuvem, antes de permitir novo uso. Prioriza salvar
   tudo o que existe no rascunho. Se não houver união segura, cria cópia. */
async function cloudResumeDraft(){
 if(!cloudActive||!cloudUser||cloudWrites)return false;
 const raw=localStorage.getItem(cloudPendingKey());
 if(!raw)return false;
 let draft;
 try{draft=JSON.parse(raw)}catch{
  cloudError="O rascunho local precisa ser exportado em Conta antes de prosseguir.";
  return false;
 }
 if(!draft||!Array.isArray(draft.trips)){
  cloudError="O rascunho local não pôde ser reconhecido. Preserve uma cópia em Conta.";
  return false;
 }
 const remoteMap=new Map(db.trips.map(t=>[t.id,t])),additions=[];
 for(const item of draft.trips){
  if(!item||typeof item.id!=="string"||!Array.isArray(item.events)||!Array.isArray(item.expenses)||!Array.isArray(item.shopping)||!Array.isArray(item.scenarios)){
   cloudError="O rascunho precisa ser recuperado manualmente pela área Conta.";
   return false;
  }
  const remote=remoteMap.get(item.id);
  if(!remote){additions.push(cloudCopy(item));continue}
  if(cloudEqual(remote,item))continue;
  const combined=cloudMergeAdditions(remote,item);
  if(combined!==ORBI_MERGE_CONFLICT){
   remoteMap.set(item.id,combined);
  }else{
   const copy=cloudCopy(item);
   copy.id=cloudRecoveryId(item.id);
   copy.title=String(item.title||"Viagem")+" (recuperada)";
   if(remoteMap.has(copy.id)&&!cloudEqual(remoteMap.get(copy.id),copy)){
    cloudError="Há uma cópia de recuperação diferente. Exporte o rascunho em Conta.";
    return false;
   }
   additions.push(copy);
  }
 }
 const ids=new Set(remoteMap.keys());
 for(const t of additions){
  if(ids.has(t.id)){
   if(!cloudEqual(remoteMap.get(t.id),t)){
    cloudError="Há um rascunho de recuperação com identificação duplicada. Exporte em Conta.";
    return false;
   }
   continue;
  }
  ids.add(t.id);remoteMap.set(t.id,t);
 }
 const before=new Map(db.trips.map(t=>[t.id,cloudStable(t)]));
 const changed=[...remoteMap.values()].some(t=>before.get(t.id)!==cloudStable(t));
 if(!changed){
  localStorage.removeItem(cloudPendingKey());cloudError="";
  return true;
 }
 db={...db,trips:[...remoteMap.values()]};
 cloudError="";cloudRemoteHint=false;
 await queueCloudSave();
 return !cloudError;
}
function cloudPendingKey(){return "orbitrip-unsynced-"+(cloudUser?.id||"unknown")}
function queueCloudSave(){
 if(!cloudActive||!cloudUser)return Promise.resolve();
 if(cloudError.startsWith("Foi encontrado")){alert("Exporte o rascunho não sincronizado e recarregue os dados da nuvem antes de continuar.");return Promise.resolve()}
 cloudWrites++;
 try{localStorage.setItem(cloudPendingKey(),JSON.stringify(db))}catch{}
 cloudJobs=cloudJobs.then(async()=>{
  const currentIds=new Set();
  for(const t of db.trips.slice()){
   currentIds.add(t.id);
   const current=JSON.stringify(t);if(cloudSaved.get(t.id)===current)continue;
   if(cloudRoles[t.id]==="viewer")throw Error("Esta viagem está no modo visualização.");
   const rev=cloudRevisions.get(t.id);
   const result=await cloudWriteSafely(t,JSON.parse(current),rev);
   cloudRevisions.set(t.id,result.revision);cloudSaved.set(t.id,result.saved);
   if(result.rebased){
    const live=db.trips.find(x=>x.id===t.id);
    if(live){
     const updated=cloudEqual(live,JSON.parse(current))
      ?result.merged:cloudMergeValue(JSON.parse(current),live,result.merged);
     if(updated===ORBI_MERGE_CONFLICT)throw Error("CONFLICT_OR_DENIED: novas alterações locais precisam de revisão");
     for(const key of Object.keys(live))if(!Object.prototype.hasOwnProperty.call(updated,key))delete live[key];
     Object.assign(live,updated);
    }
   }
   if(!cloudRoles[t.id])cloudRoles[t.id]="owner";
  }
  for(const id of [...cloudRevisions.keys()]){
   if(currentIds.has(id))continue;
   if(cloudRoles[id]!=="owner")throw Error("Somente o proprietário pode excluir viagens.");
   await cloudApi.remove(id);cloudRevisions.delete(id);cloudSaved.delete(id);delete cloudRoles[id];
  }
  cloudError="";
 }).catch(err=>{
  cloudError=/CONFLICT_OR_DENIED/.test(String(err?.message))?
    "Conflito de versões: a nuvem possui uma revisão diferente deste roteiro. Seu rascunho permanece neste dispositivo. Exporte-o ou recupere-o como cópia antes de recarregar.":(err.message||"Não foi possível sincronizar. Confira a conexão.");
 }).finally(()=>{
  cloudWrites=Math.max(0,cloudWrites-1);
  if(!cloudWrites){
   if(!cloudError){try{localStorage.removeItem(cloudPendingKey())}catch{}}
   if(cloudRemoteHint&&!cloudError)queueCloudRefresh();
   else if(cloudError)render();
   else if(!document.getElementById("modal-root")?.firstElementChild&&route==="trip")render();
  }
 });
 return cloudJobs;
}
async function cloudLoad(){
 const result=await cloudApi.list();cloudRoles=result.roles;
 db={version:1,trips:result.trips.map(r=>({...r.payload,id:r.id}))};
 cloudRevisions=new Map(result.trips.map(r=>[r.id,Number(r.revision)]));
 cloudSaved=new Map(db.trips.map(t=>[t.id,JSON.stringify(t)]));
 cloudActive=true;cloudRemoteHint=false;
 if(route==="trip"&&!db.trips.some(t=>t.id===tripId)){route="home";tripId=null}
 if(localStorage.getItem(cloudPendingKey()))cloudError="Foi encontrado um rascunho local ainda não sincronizado. Exporte-o antes de continuar.";
}
function getInviteCode(){return new URLSearchParams(location.hash.replace(/^#/,"")).get("convite")||""}
function clearInviteCode(){if(getInviteCode())history.replaceState(null,"",location.pathname+location.search)}
async function acceptLinkInvite(){
 const code=getInviteCode();if(!code)return;
 try{await cloudApi.accept(code);cloudInfo="Convite aceito. A viagem foi adicionada à sua conta."}
 catch(e){cloudInfo="Não foi possível aceitar o convite: "+e.message}
 clearInviteCode();
}
function queueCloudRefresh(){
 clearTimeout(cloudRemoteTimer);
 cloudRemoteTimer=setTimeout(async()=>{
  if(!cloudActive)return;
  if(cloudWrites||cloudError||document.querySelector("#modal-root")?.firstElementChild){cloudRemoteHint=true;return}
  try{await cloudLoad();render()}catch(e){cloudError=e.message;render()}
 },1100);
}
async function activateCloud(user){
 /* Após autenticar, o destino padrão é sempre Início / Minhas viagens. */
 welcomeVisible=false;route="home";tripId=null;tab="route";scenarioId=null;
 cloudUser=user;cloudLoading=true;render();
 try{
  await acceptLinkInvite();
  await cloudLoad();
  if(localStorage.getItem(cloudPendingKey()))await cloudResumeDraft();
  cloudApi.listen(()=>{cloudRemoteHint=true;queueCloudRefresh()});
 }catch(err){cloudError=err.message||"Erro ao carregar viagens";cloudActive=false;cloudAuthError=cloudError}
 finally{cloudLoading=false;render()}
}
/* No carregamento do site, restaurar uma sessão existente sem exigir clique
   em Começar. Sem sessão, preservar a capa pública como tela inicial. */
async function resumeAuthenticatedHome(){
 if(!cloudEnabled||cloudBypass)return;
 try{
  const user=await cloudApi.init();
  if(!user||cloudBypass||!welcomeVisible)return;
  await activateCloud(user);
 }catch(err){
  /* A abertura pública deve continuar funcionando se a sessão não existir
     ou se a verificação automática estiver temporariamente indisponível. */
  if(welcomeVisible)return;
  cloudAuthError=err?.message||"Não foi possível verificar a sessão.";
  render();
 }
}
async function cloudBoot(){
 if(!cloudEnabled||cloudBypass){cloudLoading=false;render();return}
 cloudLoading=true;render();
 try{const user=await cloudApi.init();if(user){await activateCloud(user);return}}
 catch(err){cloudAuthError=err.message||"Falha ao iniciar a sessão";cloudUser=null}
 cloudLoading=false;render();
}
async function sendCloudCode(){
 const email=(document.getElementById("orbi-auth-email")?.value||"").trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){cloudAuthError="Informe um endereço de e-mail válido.";return render()}
 try{cloudAuthError="";await cloudApi.requestCode(email);cloudEmail=email;render()}
 catch(err){cloudAuthError=err.message||"Falha ao enviar o código.";render()}
}
async function verifyCloudCode(){
 const token=(document.getElementById("orbi-auth-code")?.value||"").trim();
 if(!/^\d{6,10}$/.test(token)){cloudAuthError="Digite todos os dígitos do código recebido por e-mail (6 a 10 números).";return render()}
 try{cloudAuthError="";const user=await cloudApi.verify(cloudEmail,token);if(!user)throw Error("Sessão não encontrada.");await activateCloud(user)}
 catch(err){cloudAuthError=err.message||"Código inválido ou expirado.";render()}
}
async function logoutCloud(){
 if(cloudWrites)return alert("Conclua a sincronização antes de sair.");
 if(cloudError&&!confirm("Existem dados não sincronizados. Faça backup antes de sair. Continuar?"))return;
 try{await cloudApi.signOut()}catch(err){alert(err.message);return}
 cloudApi.stop();cloudActive=false;cloudUser=null;cloudRoles={};cloudEmail="";cloudAuthError="";cloudInfo="";cloudError="";db=parse();route="home";render();
}
function shareTrip(){
 const t=trip();if(!cloudActive||!t||cloudRoles[t.id]!=="owner")return alert("Somente o proprietário pode compartilhar.");
 document.getElementById("modal-root").innerHTML='<div class="modalbg"><section class="modal" role="dialog" aria-modal="true" aria-label="Compartilhar viagem"><header><h2>Compartilhar viagem</h2><button data-action="close" aria-label="Fechar">×</button></header><p class="muted">Gere um convite de uso único válido por sete dias. A outra pessoa deverá entrar com o e-mail dela.</p><div class="field"><label for="orbi-invite-role">Permissão</label><select id="orbi-invite-role"><option value="editor">Editor — pode modificar o roteiro</option><option value="viewer">Visualizador — somente consulta</option></select></div><div id="orbi-created-invite"></div><div class="formfooter">'+button("Gerar convite","createInvite","primary")+button("Fechar","close")+'</div></section></div>';
}
async function createCloudInvite(){
 try{
  const role=document.getElementById("orbi-invite-role")?.value||"editor";
  const inv=await cloudApi.invite(tripId,role,cloudUser.id);
  const link=location.origin+location.pathname+"#convite="+encodeURIComponent(inv.code);
  const box=document.getElementById("orbi-created-invite");
  if(box)box.innerHTML='<div class="orbi-cloud-good"><b>Código:</b> '+esc(inv.code)+'<p class="muted">Link de convite:</p><div class="orbi-share-box" id="orbi-invite-link">'+esc(link)+'</div><p class="muted">Expira em '+new Date(inv.expires_at).toLocaleDateString("pt-BR")+'. Compartilhe somente com quem você conhece.</p>'+button("Copiar link","copyInvite")+'</div>';
 }catch(e){alert("Falha ao criar convite: "+e.message)}
}
async function acceptCloudInvitation(){
 const code=(document.getElementById("orbi-invite-code")?.value||"").trim();
 if(!code)return alert("Informe o código recebido.");
 try{await cloudApi.accept(code);cloudInfo="Convite aceito. A viagem foi adicionada à conta.";await cloudLoad();route="home";render()}
 catch(e){alert("Convite não aceito: "+e.message)}
}
async function migrateLocalTrips(){
 if(!cloudActive)return;
 const local=parse().trips;if(!local.length)return alert("Nenhuma viagem local encontrada.");
 if(!confirm("Copiar "+local.length+" viagem(ns) para a nuvem? As versões locais serão preservadas."))return;
 for(const t of local){const clone=JSON.parse(JSON.stringify(t));clone.id=uid();db.trips.push(clone)}
 await queueCloudSave();
 if(!cloudError){localStorage.setItem("orbitrip-migrated-"+cloudUser.id,"1");cloudInfo="Viagens copiadas para a nuvem.";route="home";render()}
}
function downloadPendingBackup(){
 const json=localStorage.getItem(cloudPendingKey())||JSON.stringify(db);
 const blob=new Blob([json],{type:"application/json"}),a=document.createElement("a"),url=URL.createObjectURL(blob);
 a.href=url;a.download="orbitrip-rascunho-nao-sincronizado.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

async function cloudRetryPending(){
 if(!cloudActive||cloudWrites)return;
 if(cloudError.startsWith("Foi encontrado")||localStorage.getItem(cloudPendingKey())){
  const refreshed=await cloudApi.list();
  const last=db;
  /* Se existem alterações na memória, preservá-las no rascunho antes de ler a nuvem. */
  const key=cloudPendingKey();
  const raw=localStorage.getItem(key);
  if(!raw){localStorage.setItem(key,JSON.stringify(last))}
  cloudRoles=refreshed.roles;
  cloudRevisions=new Map(refreshed.trips.map(t=>[t.id,Number(t.revision)]));
  cloudSaved=new Map(refreshed.trips.map(t=>[t.id,JSON.stringify({...t.payload,id:t.id})]));
  db={version:1,trips:refreshed.trips.map(t=>({...t.payload,id:t.id}))};
  await cloudResumeDraft();render();return;
 }
 cloudError="";await queueCloudSave();render();
}
async function recoverCloudDraftAsCopy(){
 if(!cloudActive||!cloudUser||cloudWrites)return alert("Conclua a sincronização atual antes de recuperar o rascunho.");
 const json=localStorage.getItem(cloudPendingKey());
 if(!json)return alert("Não há um rascunho pendente neste navegador.");
 let draft;
 try{draft=JSON.parse(json)}catch{return alert("O rascunho armazenado não pôde ser lido. Exporte-o antes de continuar.")}
 if(!draft||!Array.isArray(draft.trips)||draft.trips.some(t=>!t||!t.id||!Array.isArray(t.events)||!Array.isArray(t.expenses)||!Array.isArray(t.shopping)||!Array.isArray(t.scenarios))){
  return alert("O formato do rascunho é inválido. Exporte-o para preservar os dados.");
 }
 if(!confirm("Recuperar alterações não sincronizadas como cópias, sem substituir as viagens que já estão na nuvem? Os dados originais serão preservados."))return;
 let server;
 try{server=await cloudApi.list()}catch(err){return alert("Não foi possível consultar a nuvem: "+(err.message||"erro de conexão"))}
 const savedIds=new Set(server.trips.map(t=>t.id));
 const existing=new Map(server.trips.map(t=>[t.id,t.payload]));
 const recover=[];
 for(const entry of draft.trips){
  if(savedIds.has(entry.id)&&cloudEqual(existing.get(entry.id),entry))continue;
  const copy=cloudCopy(entry);
  if(savedIds.has(copy.id)){
   copy.id=uid();
   copy.title=String(copy.title||"Viagem")+" (recuperada)";
  }
  if(recover.some(t=>t.id===copy.id))copy.id=uid();
  recover.push(copy);
 }
 if(!recover.length){cloudError="";localStorage.removeItem(cloudPendingKey());await cloudLoad();render();return alert("Seu rascunho já está salvo na nuvem.");}
 db={version:1,trips:[...server.trips.map(r=>({...r.payload,id:r.id})),...recover]};
 cloudRoles={...server.roles};
 cloudRevisions=new Map(server.trips.map(t=>[t.id,Number(t.revision)]));
 cloudSaved=new Map(server.trips.map(t=>[t.id,JSON.stringify({...t.payload,id:t.id})]));
 cloudError="";cloudRemoteHint=false;route="home";tripId=null;
 render();
 await queueCloudSave();
 if(!cloudError)alert("Rascunho recuperado na sua conta. Confira a viagem identificada como recuperada antes de excluir qualquer outra.");
}
async function reloadCloudManually(){
 if(cloudWrites)return alert("Sincronização em andamento.");
 if(cloudError&&!confirm("Recarregar a nuvem descarta as alterações locais não sincronizadas. Exporte o rascunho antes. Continuar?"))return;
 try{cloudError="";localStorage.removeItem(cloudPendingKey());await cloudLoad();cloudRemoteHint=false;render()}
 catch(e){cloudError=e.message;render()}
}
document.addEventListener("focusin",e=>{if(e.target.matches?.("input,textarea,select,[contenteditable]"))document.body.classList.add("v351-input-active")});
document.addEventListener("focusout",()=>{setTimeout(()=>{document.body.classList.toggle("v351-input-active",!!document.activeElement?.matches?.("input,textarea,select,[contenteditable]"))},0)});
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 if(e.target.id==="orbi-auth-email"){e.preventDefault();sendCloudCode()}
 if(e.target.id==="orbi-auth-code"){e.preventDefault();verifyCloudCode()}
 if(e.target.id==="orbi-invite-code"){e.preventDefault();acceptCloudInvitation()}
});

render();
resumeAuthenticatedHome();
if(route==="trip"&&tab==="calculator")setTimeout(calculateLive,0);
})();
</script>
