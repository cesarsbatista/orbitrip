<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d2d">
<title>VIAGENS — Planejador</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172436;background:#f4f6f9;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:default}a{color:#1678b7}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#122238;color:#e7eff8;padding:28px 17px;display:flex;flex-direction:column;gap:23px}.brand{font-weight:850;letter-spacing:.13em;font-size:22px;margin:0 12px}.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:.1em;color:#8daac7;margin-top:4px}.nav{display:grid;gap:5px}.nav button{text-align:left;background:none;color:#b4c7da;border-radius:11px;padding:12px 14px}.nav button:hover,.nav button.active{background:#253a52;color:white}.sidefoot{margin-top:auto;color:#829eb8;font-size:12px;line-height:1.7;padding:0 12px}.main{padding:32px clamp(18px,4vw,64px);max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:27px;flex-wrap:wrap}h1{font-size:28px;margin:0 0 7px;letter-spacing:-.04em}h2{font-size:18px;letter-spacing:-.025em;margin:0}h3{font-size:15px;margin:0 0 12px}p{margin:6px 0}.muted{color:#738196}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#57718a;margin:0 0 9px}.btn{background:#192d45;color:white;padding:11px 16px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#2a4968}.btn.ghost{background:white;color:#2c4660;border:1px solid #d9e1e8}.btn.ghost:hover{background:#f1f5f8}.btn.danger{color:#b43636}.btn.small{padding:7px 11px;font-size:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:white;border:1px solid #e5eaf0;border-radius:16px;padding:22px;box-shadow:0 4px 14px #243e5a06}.trip{display:flex;flex-direction:column;gap:17px}.trip h2{font-size:21px}.trip .foot{border-top:1px solid #edf0f4;padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.chip{display:inline-block;background:#edf4fb;color:#365e86;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:750}.chip.archived{background:#f1f1f1;color:#777}.chip.ongoing{background:#e6f7ec;color:#237b51}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{padding:19px}.stat strong{font-size:23px;display:block;letter-spacing:-.03em;margin:10px 0 4px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #e2e7ee;margin-bottom:23px}.tabs button{background:none;padding:13px 15px;color:#6b7e93;font-weight:750;border-bottom:3px solid transparent}.tabs button.active{color:#173451;border-bottom-color:#173451}.list{display:grid;gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 20px;border:1px solid #e8ecf2;border-radius:13px;background:white}.item .details{min-width:0}.item strong{display:block;font-size:15px;margin-bottom:4px}.item .meta{color:#7a8998;font-size:12px;line-height:1.7}.item .amount{text-align:right;font-weight:800;white-space:nowrap}.empty{text-align:center;background:white;border:1px dashed #d3dce6;border-radius:16px;padding:52px 15px;color:#788a9a}.empty h3{color:#2a3d52}.day{margin:20px 0 10px;display:flex;align-items:center;gap:15px;font-weight:800;color:#36516d}.day:after{content:"";height:1px;background:#dfe5eb;flex:1}.field{display:grid;gap:6px;margin:0 0 15px}.field label{font-weight:700;color:#3d5065;font-size:12px}input,select,textarea{width:100%;border:1px solid #d8e1eb;border-radius:9px;padding:11px 12px;background:white;color:#1b2c3d}textarea{resize:vertical;min-height:82px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}.modalbg{position:fixed;inset:0;background:#07162799;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:26px;box-shadow:0 15px 80px #001a3340}.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.modal header button{background:none;font-size:24px;color:#8795a5}.formfooter{display:flex;gap:10px;justify-content:flex-end;margin-top:9px}.bar{background:#e8eff6;border-radius:99px;height:9px;overflow:hidden;margin:12px 0}.bar span{display:block;background:#4e84b5;height:100%;border-radius:99px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.summarylist{display:grid;gap:12px}.summaryline{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f5}.note{border-left:3px solid #5c8db5;padding:11px 14px;background:#f0f6fb;color:#57718a;font-size:12px;border-radius:4px}.badge{font-size:11px;color:#7490a9;text-transform:uppercase;letter-spacing:.1em}.selectmini{width:auto;min-width:165px}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.linksmall{font-size:12px;text-decoration:none}.number{font-variant-numeric:tabular-nums}.hidden{display:none!important}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.shell{display:block}.sidebar{padding:14px 16px;display:block}.brand{font-size:18px;margin:0 0 12px}.sidefoot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.main{padding:22px 14px}.grid,.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.statgrid{gap:9px}.item{align-items:flex-start;flex-direction:column}.item .amount{text-align:left}.modal{padding:18px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">VIAGENS<small>PLANEJADOR PESSOAL</small></div><nav class="nav"><button data-route="home" class="active">◫ &nbsp; Minhas viagens</button><button data-route="archived">▤ &nbsp; Arquivadas</button><button data-route="data">↥ &nbsp; Dados e backup</button></nav><div class="sidefoot">Planeje cada etapa.<br>Revise seus custos.<br>Guarde suas histórias.<br><br>Versão 1.0 · Dados neste navegador</div></aside><main class="main" id="app"></main></div><div id="modal-root"></div>
<script>
(()=>{
"use strict";
const KEY="viagens_v1";
const uid=()=>globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2);
const fresh=()=>({version:1,trips:[]});
const parse=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.trips)?d:fresh()}catch{return fresh()}};
let db=parse(),route="home",tripId=null,tab="route",scenarioId=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,c="BRL")=>{try{return new Intl.NumberFormat("pt-BR",{style:"currency",currency:c}).format(Number(n)||0)}catch{return fmt(n,"BRL")}};
const date=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const period=t=>[date(t.start),date(t.end)].join(" — ");
const money=v=>Math.max(0,Number(v)||0);
const sum=arr=>arr.reduce((s,v)=>s+money(v),0);
const trip=()=>db.trips.find(t=>t.id===tripId);
const scenario=t=>t.scenarios.find(s=>s.id===scenarioId)||t.scenarios[0];
const cost=(t,sid,actual=false)=>sum(t.expenses.filter(e=>!e.scenarioId||e.scenarioId===sid).map(e=>actual?e.actual:e.planned));
const totalEvents=t=>t.events.length;
function navigate(r,id){route=r;if(id)tripId=id;tab="route";scenarioId=null;render()}
function sidebar(){document.querySelectorAll("[data-route]").forEach(b=>b.classList.toggle("active",b.dataset.route===route||(route==="trip"&&b.dataset.route==="home")))}
const button=(label,action,kind="ghost")=>'<button class="btn '+kind+' small" data-action="'+action+'">'+label+'</button>';
function render(){sidebar();const a=document.getElementById("app");if(route==="home"||route==="archived")a.innerHTML=home(route==="archived");else if(route==="trip")a.innerHTML=detail();else a.innerHTML=dataPage()}
function home(archived){const items=db.trips.filter(t=>!!t.archived===archived).sort((a,b)=>(a.start||"").localeCompare(b.start||""));const future=db.trips.filter(t=>!t.archived);return '<div class="top"><div><div class="eyebrow">PAINEL DE VIAGENS</div><h1>'+(archived?"Viagens arquivadas":"Minhas viagens")+'</h1><p class="muted">'+(archived?"Histórico das experiências já realizadas.":"Organize múltiplas viagens, roteiros e orçamentos em um só lugar.")+'</p></div>'+button("+ Nova viagem","newTrip","")+'</div>'+(archived?"":'<div class="statgrid"><div class="card stat"><div class="badge">Viagens ativas</div><strong>'+future.length+'</strong><span class="muted">Em planejamento</span></div><div class="card stat"><div class="badge">Arquivadas</div><strong>'+db.trips.filter(t=>t.archived).length+'</strong><span class="muted">No histórico</span></div><div class="card stat"><div class="badge">Atividades</div><strong>'+sum(future.map(t=>totalEvents(t)))+'</strong><span class="muted">Programadas</span></div><div class="card stat"><div class="badge">Cenários</div><strong>'+sum(future.map(t=>t.scenarios.length))+'</strong><span class="muted">Opções de orçamento</span></div></div>')+(items.length?'<div class="grid">'+items.map(t=>'<article class="card trip"><div class="row" style="justify-content:space-between"><span class="chip '+(archived?"archived":"ongoing")+'">'+(archived?"Arquivada":"Planejamento")+'</span><span class="muted">'+esc(t.transport||"A definir")+'</span></div><div><h2>'+esc(t.title)+'</h2><p class="muted">'+esc(t.destinations||"Destino a definir")+'</p><p class="muted">'+period(t)+'</p></div><div class="row"><span class="chip">'+t.events.length+' etapas</span><span class="chip">'+t.scenarios.length+' cenários</span></div><div class="foot"><div><div class="muted" style="font-size:11px">Previsão inicial</div><strong>'+fmt(cost(t,t.scenarios[0]?.id),t.currency)+'</strong></div>'+button("Abrir viagem","open:"+t.id,"")+'</div></article>').join("")+'</div>':'<div class="empty"><h3>'+(archived?"Nenhuma viagem arquivada":"Seu primeiro roteiro começa aqui")+'</h3><p>'+(archived?"As viagens concluídas aparecerão neste espaço.":"Crie uma viagem para organizar destinos, programação, cenários e despesas.")+'</p><br>'+button("+ Criar viagem","newTrip","")+'</div>')}
function detail(){const t=trip();if(!t){route="home";return home(false)}if(!scenarioId)scenarioId=t.scenarios[0]?.id;let s=scenario(t);const predicted=cost(t,s?.id),actual=cost(t,s?.id,true);return '<div class="top"><div><div class="eyebrow"><a href="#" data-action="back">Minhas viagens</a> / '+(t.archived?"ARQUIVADA":"PLANEJAMENTO")+'</div><h1>'+esc(t.title)+'</h1><p class="muted">'+esc(t.destinations||"Sem destino definido")+' · '+period(t)+' · '+esc(t.transport||"Transporte a definir")+'</p></div><div class="row">'+button("Editar viagem","editTrip")+button("Duplicar","duplicateTrip")+button(t.archived?"Reativar":"Arquivar",t.archived?"restore":"archive")+'</div></div><div class="statgrid"><div class="card stat"><div class="badge">Orçamento previsto</div><strong class="number">'+fmt(predicted,t.currency)+'</strong><span class="muted">Cenário selecionado</span></div><div class="card stat"><div class="badge">Valor realizado</div><strong class="number">'+fmt(actual,t.currency)+'</strong><span class="muted">Gastos registrados</span></div><div class="card stat"><div class="badge">Diferença</div><strong class="number">'+fmt(predicted-actual,t.currency)+'</strong><span class="muted">Previsto menos realizado</span></div><div class="card stat"><div class="badge">Programação</div><strong>'+t.events.length+'</strong><span class="muted">Atividades e deslocamentos</span></div></div><div class="toolbar"><div class="row"><span class="muted"><b>Cenário:</b></span><select class="selectmini" id="scenario-select">'+t.scenarios.map(x=>'<option value="'+x.id+'" '+(s?.id===x.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></div>'+button("+ Cenário","newScenario")+'</div><div class="tabs">'+[["route","Roteiro"],["budget","Despesas"],["compare","Comparar cenários"],["shopping","Compras"],["info","Informações"]].map(([id,label])=>'<button class="'+(tab===id?"active":"")+'" data-tab="'+id+'">'+label+'</button>').join("")+'</div>'+({route:renderRoute,budget:renderBudget,compare:renderCompare,shopping:renderShopping,info:renderInfo}[tab]||renderRoute)(t,s)}
function renderRoute(t,s){const events=t.events.filter(e=>!e.scenarioId||e.scenarioId===s.id).slice().sort((a,b)=>(a.day+" "+a.startTime).localeCompare(b.day+" "+b.startTime));let prev="";return '<div class="toolbar"><div><h2>Programação por dia</h2><p class="muted">Horários, atrações, hospedagens e deslocamentos.</p></div>'+button("+ Adicionar etapa","newEvent","")+'</div>'+(events.length?events.map(e=>{let h="";if(e.day!==prev){prev=e.day;h='<div class="day">'+date(e.day)+'</div>'}return h+'<article class="item"><div class="details"><div class="row"><span class="chip">'+esc(e.category||"Atividade")+'</span><span class="muted">'+esc([e.startTime,e.endTime].filter(Boolean).join(" — "))+'</span></div><strong style="margin-top:9px">'+esc(e.title)+'</strong><div class="meta">'+esc(e.address||"")+(e.address&&e.notes?" · ":"")+esc(e.notes||"")+'</div>'+(e.url?'<a class="linksmall" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">Abrir link ↗</a>':"")+'</div><div class="row">'+(e.estimated?'<div class="amount">'+fmt(e.estimated,t.currency)+'</div>':"")+button("Editar","editEvent:"+e.id)+button("Excluir","removeEvent:"+e.id,"ghost danger")+'</div></article>'}).join(""):'<div class="empty"><h3>Nenhuma etapa neste cenário</h3><p>Adicione atividades, visitas, transportes ou hospedagens.</p></div>')+'<p class="note" style="margin-top:20px">Etapas marcadas como “Todos os cenários” aparecem em qualquer alternativa da viagem. Valores informados nas etapas são indicativos; o orçamento consolidado é calculado na aba Despesas.</p>'}
function renderBudget(t,s){const expenses=t.expenses.filter(e=>!e.scenarioId||e.scenarioId===s.id);const cats=[...new Set(expenses.map(e=>e.category))];return '<div class="toolbar"><div><h2>Orçamento e despesas</h2><p class="muted">Compare os valores planejados e os efetivamente gastos.</p></div>'+button("+ Adicionar despesa","newExpense","")+'</div><div class="two"><div class="list">'+(expenses.length?expenses.map(e=>'<article class="item"><div class="details"><span class="chip">'+esc(e.category)+'</span><strong style="margin-top:9px">'+esc(e.title)+'</strong><div class="meta">'+(e.day?date(e.day)+" · ":"")+(e.scenarioId?"Exclusivo deste cenário":"Todos os cenários")+'</div></div><div><div class="amount">'+fmt(e.planned,t.currency)+'</div><div class="meta">Real: '+fmt(e.actual,t.currency)+'</div><div class="actions">'+button("Editar","editExpense:"+e.id)+button("Excluir","removeExpense:"+e.id,"ghost danger")+'</div></div></article>').join(""):'<div class="empty"><h3>Sem despesas</h3><p>Cadastre hospedagem, alimentação, combustível, passagens e atrações.</p></div>')+'</div><div class="card"><h3>Distribuição do orçamento</h3>'+(cats.length?cats.map(c=>{const v=sum(expenses.filter(e=>e.category===c).map(e=>e.planned));return '<div class="summaryline"><span>'+esc(c)+'</span><strong>'+fmt(v,t.currency)+'</strong></div><div class="bar"><span style="width:'+Math.min(100,predictedPercent(v,cost(t,s.id)))+'%"></span></div>'}).join(""):'<p class="muted">Categorias aparecerão após o primeiro lançamento.</p>')+'</div></div>'}
function predictedPercent(x,total){return total?x/total*100:0}
function renderCompare(t,s){return '<div class="toolbar"><div><h2>Comparativo de cenários</h2><p class="muted">Alternativas de custo para a mesma viagem.</p></div>'+button("+ Criar cenário","newScenario","")+'</div><div class="grid">'+t.scenarios.map(x=>'<article class="card"><div class="row" style="justify-content:space-between"><span class="chip">'+(x.id===s?.id?"Selecionado":"Alternativa")+'</span></div><h2 style="margin-top:16px">'+esc(x.name)+'</h2><p class="muted">'+esc(x.notes||"Sem observações")+'</p><strong style="font-size:25px;display:block;margin:24px 0 3px">'+fmt(cost(t,x.id),t.currency)+'</strong><p class="muted">Orçamento estimado</p><div class="row" style="margin-top:18px">'+button("Selecionar","chooseScenario:"+x.id)+button("Editar","editScenario:"+x.id)+(t.scenarios.length>1?button("Excluir","removeScenario:"+x.id,"ghost danger"):"")+'</div></article>').join("")+'</div><p class="note" style="margin-top:20px">Uma despesa pode valer para todos os cenários ou apenas para um cenário. Despesas compartilhadas entram no cálculo de todos eles.</p>'}
function renderShopping(t,s){const items=t.shopping.filter(e=>!e.scenarioId||e.scenarioId===s.id);return '<div class="toolbar"><div><h2>Lista de compras</h2><p class="muted">Itens, quantidades, referências de preço e itens adquiridos.</p></div>'+button("+ Novo item","newItem","")+'</div>'+(items.length?'<div class="list">'+items.map(i=>'<article class="item"><div class="details"><strong>'+esc(i.title)+'</strong><div class="meta">'+esc(i.quantity||"")+" · "+esc(i.store||"Sem loja")+' · '+(i.bought?"Comprado":"Pendente")+'</div></div><div class="row"><strong>'+fmt(i.price,t.currency)+'</strong>'+button(i.bought?"Desmarcar":"Comprado","toggleItem:"+i.id)+button("Editar","editItem:"+i.id)+button("Excluir","removeItem:"+i.id,"ghost danger")+'</div></article>').join("")+'</div><div class="card" style="margin-top:15px"><b>Total da lista: '+fmt(sum(items.map(i=>i.price)),t.currency)+'</b></div>':'<div class="empty"><h3>Lista vazia</h3><p>Adicione produtos para a viagem.</p></div>')+'<p class="note" style="margin-top:18px">A lista de compras é independente do orçamento. Para contabilizá-la no custo total, registre o valor correspondente também em Despesas.</p>'}
function renderInfo(t){return '<div class="two"><div class="card"><h3>Dados gerais</h3>'+[['Nome',t.title],['Destinos',t.destinations],['Origem',t.origin],['Período',period(t)],['Participantes',t.travelers],['Transporte',t.transport],['Moeda',t.currency]].map(([k,v])=>'<div class="summaryline"><span class="muted">'+k+'</span><strong>'+esc(v||"—")+'</strong></div>').join("")+'</div><div class="card"><h3>Observações</h3><p style="white-space:pre-wrap">'+esc(t.notes||"Nenhuma observação registrada.")+'</p><hr style="border:0;border-top:1px solid #e7ebf0;margin:24px 0"><h3>Gerenciar viagem</h3><div class="row">'+button("Editar informações","editTrip")+button("Excluir viagem","deleteTrip","ghost danger")+'</div></div></div>'}
function dataPage(){return '<div class="top"><div><div class="eyebrow">SEGURANÇA E PORTABILIDADE</div><h1>Dados e backup</h1><p class="muted">Faça cópias de segurança e transporte seus roteiros para outro navegador.</p></div></div><div class="two"><div class="card"><h2>Exportar dados</h2><p class="muted">Baixa todas as viagens, cenários, despesas, roteiros e compras em um arquivo JSON.</p><br>'+button("Baixar backup JSON","export","")+'</div><div class="card"><h2>Importar dados</h2><p class="muted">Restaura um backup anteriormente exportado. Os dados existentes serão substituídos após confirmação.</p><br><label class="btn ghost" for="import-file">Selecionar JSON</label><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div></div><div class="card" style="margin-top:17px"><h3>Importante sobre o armazenamento</h3><p class="muted">Esta V1 salva os dados no armazenamento local do navegador. Os dados não são sincronizados automaticamente entre dispositivos, não são armazenados no GitHub e podem ser perdidos se o navegador for limpo. Exporte backups regularmente. Sincronização com login e banco de dados poderá ser incorporada em uma versão posterior.</p></div>'}
function field(label,name,value="",type="text",opts=""){return '<div class="field"><label for="f_'+name+'">'+label+'</label>'+(type==="textarea"?'<textarea id="f_'+name+'" name="'+name+'" '+opts+'>'+esc(value)+'</textarea>':type==="select"?'<select id="f_'+name+'" name="'+name+'" '+opts+'>'+value+'</select>':'<input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+opts+'>')+'</div>'}
function options(values,current){return values.map(v=>{const [key,label]=Array.isArray(v)?v:[v,v];return '<option value="'+esc(key)+'" '+(key===current?"selected":"")+'>'+esc(label)+'</option>'}).join("")}
function scope(t,val){return field("Válido para","scenarioId",options([["","Todos os cenários"],...t.scenarios.map(x=>[x.id,x.name])],val),"select")}
function modal(title,body,submit){document.getElementById("modal-root").innerHTML='<div class="modalbg"><section class="modal" role="dialog" aria-modal="true"><header><h2>'+esc(title)+'</h2><button type="button" data-action="close" aria-label="Fechar">×</button></header><form id="edit-form" data-submit="'+submit+'">'+body+'<div class="formfooter"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></section></div>';document.getElementById("edit-form").querySelector("input,select,textarea")?.focus()}
const close=()=>document.getElementById("modal-root").innerHTML="";
function tripForm(t){modal(t?"Editar viagem":"Nova viagem",'<div class="formgrid">'+field("Nome da viagem","title",t?.title||"","text","required")+field("Destinos","destinations",t?.destinations)+field("Origem","origin",t?.origin)+field("Participantes","travelers",t?.travelers)+field("Início","start",t?.start,"date")+field("Fim","end",t?.end,"date")+field("Transporte","transport",options(["Carro","Avião","Trem","Ônibus","Navio","Misto","A definir"],t?.transport||"Carro"),"select")+field("Moeda","currency",options([["BRL","Real (BRL)"],["USD","Dólar (USD)"],["EUR","Euro (EUR)"],["CAD","Dólar canadense (CAD)"],["GBP","Libra (GBP)"]],t?.currency||"BRL"),"select")+'<div class="wide">'+field("Anotações gerais","notes",t?.notes,"textarea")+'</div></div>',"trip:"+(t?.id||"new"))}
function eventForm(e){const t=trip();modal(e?"Editar etapa":"Nova etapa",'<div class="formgrid">'+field("Descrição da etapa","title",e?.title||"","text","required")+field("Categoria","category",options(["Atração","Deslocamento","Restaurante","Hospedagem","Voo","Compromisso","Passeio","Outro"],e?.category||"Atração"),"select")+field("Data","day",e?.day||t.start,"date")+field("Horário inicial","startTime",e?.startTime,"time")+field("Horário final","endTime",e?.endTime,"time")+field("Valor informativo","estimated",e?.estimated||"","number",'min="0" step="0.01"')+'<div class="wide">'+field("Endereço ou coordenadas","address",e?.address)+'</div><div class="wide">'+field("Site ou link","url",e?.url,"url")+'</div><div class="wide">'+scope(t,e?.scenarioId??"")+'</div><div class="wide">'+field("Observações","notes",e?.notes,"textarea")+'</div></div>',"event:"+(e?.id||"new"))}
function expenseForm(e){const t=trip();modal(e?"Editar despesa":"Nova despesa",'<div class="formgrid">'+field("Descrição","title",e?.title,"text","required")+field("Categoria","category",options(["Hospedagem","Alimentação","Combustível","Passagens","Transporte","Atrações","Compras","Seguro","Outros"],e?.category||"Alimentação"),"select")+field("Previsto","planned",e?.planned??"","number",'min="0" step="0.01"')+field("Realizado","actual",e?.actual??"","number",'min="0" step="0.01"')+field("Data","day",e?.day||"","date")+'<div class="wide">'+scope(t,e?.scenarioId??scenarioId)+'</div></div>',"expense:"+(e?.id||"new"))}
function scenarioForm(s){modal(s?"Editar cenário":"Novo cenário",field("Nome","name",s?.name||"","text","required")+field("Observações","notes",s?.notes,"textarea"),"scenario:"+(s?.id||"new"))}
function itemForm(i){const t=trip();modal(i?"Editar item":"Novo item",'<div class="formgrid">'+field("Produto","title",i?.title||"","text","required")+field("Quantidade","quantity",i?.quantity)+field("Preço total","price",i?.price??"","number",'min="0" step="0.01"')+field("Loja / referência","store",i?.store)+'<div class="wide">'+scope(t,i?.scenarioId??"")+'</div></div>',"item:"+(i?.id||"new"))}
const getObj=f=>Object.fromEntries(new FormData(f).entries());
function submit(form){const [kind,id]=form.dataset.submit.split(":");const v=getObj(form);const t=trip();if(kind==="trip"){if(v.start&&v.end&&v.end<v.start){alert("A data final deve ser posterior à inicial.");return}if(id==="new"){const x={...v,id:uid(),archived:false,scenarios:[{id:uid(),name:"Principal",notes:""}],events:[],expenses:[],shopping:[]};db.trips.push(x);tripId=x.id;route="trip";scenarioId=x.scenarios[0].id}else Object.assign(t,v)}else if(kind==="scenario"){const x={...v,id:id==="new"?uid():id};if(id==="new"){t.scenarios.push(x);scenarioId=x.id}else Object.assign(t.scenarios.find(z=>z.id===id),v)}else {const list={event:"events",expense:"expenses",item:"shopping"}[kind];const normalized={...v};if(kind==="event"){normalized.estimated=money(v.estimated);if(v.url&&!/^https?:\/\//i.test(v.url)){alert("O link deve começar com http:// ou https://");return}}if(kind==="expense"){normalized.planned=money(v.planned);normalized.actual=money(v.actual)}if(kind==="item"){normalized.price=money(v.price);normalized.bought=id==="new"?false:t.shopping.find(z=>z.id===id)?.bought}if(id==="new")t[list].push({...normalized,id:uid()});else Object.assign(t[list].find(z=>z.id===id),normalized)}save();close();render()}
function del(list,id){const t=trip();const item=t[list].find(z=>z.id===id);if(!item)return;if(!confirm("Excluir este registro?"))return;t[list]=t[list].filter(x=>x.id!==id);save();render()}
function action(a){const t=trip();if(a==="newTrip")return tripForm();if(a==="close")return close();if(a==="back")return navigate("home");if(a.startsWith("open:"))return navigate("trip",a.slice(5));if(a==="editTrip")return tripForm(t);if(a==="newEvent")return eventForm();if(a.startsWith("editEvent:"))return eventForm(t.events.find(x=>x.id===a.slice(10)));if(a.startsWith("removeEvent:"))return del("events",a.slice(12));if(a==="newExpense")return expenseForm();if(a.startsWith("editExpense:"))return expenseForm(t.expenses.find(x=>x.id===a.slice(12)));if(a.startsWith("removeExpense:"))return del("expenses",a.slice(14));if(a==="newScenario")return scenarioForm();if(a.startsWith("editScenario:"))return scenarioForm(t.scenarios.find(x=>x.id===a.slice(13)));if(a.startsWith("chooseScenario:")){scenarioId=a.slice(15);tab="route";return render()}if(a.startsWith("removeScenario:")){const id=a.slice(15);if(t.scenarios.length===1)return;if(!confirm("Excluir o cenário e todos os registros exclusivos dele?"))return;t.scenarios=t.scenarios.filter(x=>x.id!==id);for(const k of ["events","expenses","shopping"])t[k]=t[k].filter(x=>x.scenarioId!==id);scenarioId=t.scenarios[0].id;save();return render()}if(a==="newItem")return itemForm();if(a.startsWith("editItem:"))return itemForm(t.shopping.find(x=>x.id===a.slice(9)));if(a.startsWith("removeItem:"))return del("shopping",a.slice(11));if(a.startsWith("toggleItem:")){const x=t.shopping.find(i=>i.id===a.slice(11));if(x)x.bought=!x.bought;save();return render()}if(a==="archive"||a==="restore"){t.archived=a==="archive";save();return navigate(t.archived?"archived":"home")}if(a==="duplicateTrip"){const clone=JSON.parse(JSON.stringify(t));const map=new Map();clone.id=uid();clone.title+=" (cópia)";clone.archived=false;clone.scenarios.forEach(s=>{const old=s.id;s.id=uid();map.set(old,s.id)});for(const k of ["events","expenses","shopping"])clone[k].forEach(e=>{e.id=uid();if(e.scenarioId)e.scenarioId=map.get(e.scenarioId)||""});db.trips.push(clone);save();return navigate("trip",clone.id)}if(a==="deleteTrip"){if(!confirm("Excluir definitivamente esta viagem e todos os dados relacionados?"))return;db.trips=db.trips.filter(x=>x.id!==t.id);save();return navigate("home")}if(a==="export"){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),el=document.createElement("a");el.href=url;el.download="viagens-backup-"+new Date().toISOString().slice(0,10)+".json";el.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action],[data-route],[data-tab]");if(!b)return;if(b.tagName==="A")e.preventDefault();if(b.dataset.route)return navigate(b.dataset.route);if(b.dataset.tab){tab=b.dataset.tab;return render()}if(b.dataset.action)return action(b.dataset.action)});
document.addEventListener("change",async e=>{if(e.target.id==="scenario-select"){scenarioId=e.target.value;render()}if(e.target.id==="import-file"){const file=e.target.files?.[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.trips)||d.trips.some(t=>!t.id||!Array.isArray(t.scenarios)||!Array.isArray(t.events)||!Array.isArray(t.expenses)||!Array.isArray(t.shopping)))throw Error("Estrutura inválida.");if(!confirm("Substituir todos os dados atuais pelo backup selecionado?"))return;db={version:1,trips:d.trips};save();navigate("home")}catch(err){alert("Não foi possível importar o arquivo: "+err.message)}}});
document.addEventListener("submit",e=>{if(e.target.id==="edit-form"){e.preventDefault();submit(e.target)}});
document.addEventListener("click",e=>{if(e.target.classList.contains("modalbg"))close()});
render();
})();
</script>
</body></html>
