<!doctype html>
<html lang="pt-BR">
<body style="background:#f6f6f6;color:#202020;font-family:Arial,Helvetica,sans-serif;padding:24px">
  <main style="max-width:440px;margin:auto;background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:28px">
    <div style="font-size:12px;letter-spacing:2px;font-weight:bold">ORBITRIP</div>
    <h1 style="font-size:24px;margin:22px 0 10px">Seu código de acesso</h1>
    <p style="font-size:14px;line-height:1.6;color:#555">Digite este código no aplicativo para entrar na sua conta.</p>
    <p style="font-size:32px;letter-spacing:7px;font-weight:bold;text-align:center;margin:28px 0">{{ .Token }}</p>
    <p style="font-size:12px;color:#888">Se você não solicitou este acesso, ignore a mensagem. Não compartilhe o código.</p>
  </main>
</body>
</html>
